<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文管理 - RSAG</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>RSAG 管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-role="admin">
                    📊 仪表板
                </a>
                <a href="publications.html" class="nav-item active">
                    📚 论文管理
                </a>
                <a href="news.html" class="nav-item">
                    📰 新闻管理
                </a>
                <a href="team.html" class="nav-item" data-role="admin">
                    👥 团队管理
                </a>
                <a href="files.html" class="nav-item" data-role="admin">
                    📁 文件管理
                </a>
                <a href="users.html" class="nav-item" data-role="admin">
                    🔐 账号管理
                </a>
                <button class="nav-item logout">
                    🚪 退出登录
                </button>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="content-header">
                <h1>论文管理</h1>
                <p>管理课题组发表的论文和研究成果</p>
                <div style="margin-top: 0.6rem; color: #64748b; font-size: 0.9rem;">
                    当前策略：成员可提交/编辑本人论文，系统会自动进入“待审核”；管理员负责批量审核与发布。
                </div>
            </div>

            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="搜索论文标题、作者..." id="search-input">
                        <div class="search-icon">🔍</div>
                    </div>
                    <select id="type-filter" class="form-select" style="width: auto; margin-left: 1rem;">
                        <option value="">全部类型</option>
                        <option value="SCI">SCI</option>
                        <option value="EI">EI</option>
                        <option value="Conference">国际会议</option>
                        <option value="DomesticConference">国内会议</option>
                    </select>
                    <select id="status-filter" class="form-select" style="width: auto; margin-left: 1rem;">
                        <option value="">全部状态</option>
                        <option value="draft">草稿</option>
                        <option value="pending_review">待审核</option>
                        <option value="published">已发布</option>
                        <option value="scheduled">定时发布</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <select id="bulk-status" class="form-select" style="width:auto;" data-role="admin">
                        <option value="">批量改状态</option>
                        <option value="draft">草稿</option>
                        <option value="pending_review">待审核</option>
                        <option value="published">已发布</option>
                        <option value="scheduled">定时发布</option>
                    </select>
                    <button class="btn btn-secondary" id="bulk-apply-btn" disabled data-role="admin">
                        应用(0)
                    </button>
                    <a class="btn btn-secondary" href="/publications-api.html" target="_blank" rel="noopener noreferrer">
                        🔗 前台论文页
                    </a>
                    <button class="btn btn-primary" id="add-publication-btn">
                        ➕ 添加论文
                    </button>
                </div>
            </div>

            <!-- 论文列表 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="publications-table" style="table-layout: fixed; width: 100%;">
                            <thead>
                                <tr>
                                    <th style="width: 42px;" id="select-column-header" data-role="admin"><input type="checkbox" id="select-all-publications"></th>
                                    <th style="width: 36%;">标题</th>
                                    <th style="width: 26%;">作者</th>
                                    <th style="width: 15%;">期刊</th>
                                    <th style="width: 70px;">年份</th>
                                    <th style="width: 110px;">状态</th>
                                    <th style="width: 170px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="publications-tbody">
                                <tr>
                                    <td colspan="7" style="text-align: center; padding: 2rem;">
                                        <div class="spinner" style="margin: 0 auto 1rem;"></div>
                                        加载中...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="pagination-container"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 添加/编辑论文模态框 -->
    <div id="publication-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; overflow-y: auto;">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="background: white; border-radius: 8px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;">
                <div class="card-header">
                    <h3 id="modal-title">添加论文</h3>
                </div>
                <div class="card-body">
                    <form id="publication-form">
                        <input type="hidden" id="publication-id" name="id">
                        
                        <div class="form-group">
                            <label for="title" class="form-label">标题 *</label>
                            <input type="text" id="title" name="title" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="authors" class="form-label">作者 *</label>
                            <input type="text" id="authors" name="authors" class="form-input" placeholder="多个作者用逗号分隔" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="journal" class="form-label">期刊 *</label>
                            <input type="text" id="journal" name="journal" class="form-input" required>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label for="year" class="form-label">年份 *</label>
                                <input type="number" id="year" name="year" class="form-input" min="2000" max="2030" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="volume" class="form-label">卷期</label>
                                <input type="text" id="volume" name="volume" class="form-input">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="doi" class="form-label">DOI</label>
                            <input type="text" id="doi" name="doi" class="form-input" placeholder="例如: 10.1016/j.anucene.2025.111240">
                        </div>
                        
                        <div class="form-group">
                            <label for="url" class="form-label">论文链接</label>
                            <input type="url" id="url" name="url" class="form-input">
                        </div>
                        
                        <div class="form-group">
                            <label for="abstract" class="form-label">摘要</label>
                            <textarea id="abstract" name="abstract" class="form-textarea" rows="4"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="keywords" class="form-label">关键词</label>
                            <input type="text" id="keywords" name="keywords" class="form-input" placeholder="用逗号分隔">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">论文类别（可多选）</label>
                            <div style="display:flex; gap: 1rem; flex-wrap: wrap;">
                                <label><input type="checkbox" name="types" value="SCI"> SCI</label>
                                <label><input type="checkbox" name="types" value="EI"> EI</label>
                                <label><input type="checkbox" name="types" value="Conference"> 国际会议</label>
                                <label><input type="checkbox" name="types" value="DomesticConference"> 国内会议</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="status" class="form-label">状态</label>
                            <select id="status" name="status" class="form-select">
                                <option value="draft">草稿</option>
                                <option value="pending_review">待审核</option>
                                <option value="published">已发布</option>
                                <option value="scheduled">定时发布</option>
                            </select>
                        </div>

                        <div class="form-group" id="scheduled-publish-group" style="display:none;">
                            <label for="scheduled_publish_at" class="form-label">定时发布时间 *</label>
                            <input type="datetime-local" id="scheduled_publish_at" name="scheduled_publish_at" class="form-input">
                            <div style="color:#64748b; font-size:0.75rem; margin-top:0.35rem;">仅在状态为“定时发布”时生效</div>
                        </div>
                        
                        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                            <button type="button" class="btn btn-secondary" id="cancel-btn">取消</button>
                            <button type="button" class="btn btn-secondary" id="upload-pdf-btn">上传PDF</button>
                            <button type="submit" class="btn btn-primary" id="save-btn">
                                <span id="save-text">保存</span>
                                <span id="save-loading" class="loading" style="display: none;">
                                    <span class="spinner"></span>
                                    保存中...
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="pdf-input" accept="application/pdf" style="display:none;" />

    <script src="js/admin.js"></script>
    <script>
        let currentPage = 1;
        let currentSearch = '';
        let currentType = '';
        let currentStatus = '';
        const selectedPublicationIds = new Set();
        const workflowStatuses = ['draft', 'pending_review', 'published', 'scheduled'];
        const currentUser = AdminUtils.getCurrentUser();
        const isAdmin = AdminUtils.isAdmin();

        function getTableColumnSpan() {
            return isAdmin ? 7 : 6;
        }

        function applyRoleControls() {
            const addBtn = document.getElementById('add-publication-btn');
            const saveText = document.getElementById('save-text');
            const statusSelect = document.getElementById('status');

            if (!isAdmin) {
                addBtn.textContent = '➕ 提交论文';
                saveText.textContent = '提交审核';
                statusSelect.innerHTML = '<option value="pending_review">待审核</option>';
                statusSelect.value = 'pending_review';
            }

            updateScheduledFieldVisibility();
        }

        function toDatetimeLocalValue(value) {
            if (!value) return '';
            const dt = new Date(value);
            if (Number.isNaN(dt.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
        }

        function updateScheduledFieldVisibility() {
            const statusValue = document.getElementById('status').value;
            const group = document.getElementById('scheduled-publish-group');
            if (statusValue === 'scheduled') {
                group.style.display = 'block';
            } else {
                group.style.display = 'none';
                document.getElementById('scheduled_publish_at').value = '';
            }
        }

        function applyInitialFiltersFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const status = String(params.get('status') || '').trim();
            const type = String(params.get('type') || '').trim();
            const search = String(params.get('search') || '').trim();

            if (workflowStatuses.includes(status)) {
                currentStatus = status;
                document.getElementById('status-filter').value = status;
            }

            if (['SCI', 'EI', 'Conference', 'DomesticConference'].includes(type)) {
                currentType = type;
                document.getElementById('type-filter').value = type;
            }

            if (search) {
                currentSearch = search;
                document.getElementById('search-input').value = search;
            }
        }

        function resetPublicationSelection() {
            selectedPublicationIds.clear();
            syncPublicationSelectionControls();
        }

        function syncPublicationSelectionControls() {
            const applyBtn = document.getElementById('bulk-apply-btn');
            const status = document.getElementById('bulk-status').value;
            const count = selectedPublicationIds.size;

            if (!isAdmin) {
                applyBtn.disabled = true;
                applyBtn.textContent = '应用(0)';
                return;
            }

            applyBtn.disabled = !(count > 0 && status);
            applyBtn.textContent = `应用(${count})`;

            const selectAll = document.getElementById('select-all-publications');
            const rowCheckboxes = Array.from(document.querySelectorAll('.publication-row-select'));
            const checkedCount = rowCheckboxes.filter((cb) => cb.checked).length;
            selectAll.checked = rowCheckboxes.length > 0 && checkedCount === rowCheckboxes.length;
            selectAll.indeterminate = checkedCount > 0 && checkedCount < rowCheckboxes.length;
        }

        async function applyBulkPublicationStatus() {
            if (!isAdmin) {
                AdminUtils.showNotification('仅管理员可批量审核论文', 'error');
                return;
            }

            const status = document.getElementById('bulk-status').value;
            const ids = Array.from(selectedPublicationIds);

            if (!status || !ids.length) {
                AdminUtils.showNotification('请先选择目标状态和记录', 'error');
                return;
            }

            let scheduledPublishAt = null;
            if (status === 'scheduled') {
                const input = prompt('请输入定时发布时间（格式：YYYY-MM-DDTHH:mm）');
                if (!input) {
                    return;
                }
                scheduledPublishAt = input.trim();
            }

            const confirmed = await AdminUtils.showConfirm(`确认将 ${ids.length} 篇论文更新为“${getStatusText(status)}”吗？`);
            if (!confirmed) return;

            try {
                const payload = {
                    ids,
                    status,
                    ...(scheduledPublishAt && { scheduled_publish_at: scheduledPublishAt })
                };
                const result = await AdminUtils.apiRequest('/publications/batch', {
                    method: 'POST',
                    body: payload
                });

                AdminUtils.showNotification(result.message || '批量更新成功', 'success');
                document.getElementById('select-all-publications').checked = false;
                resetPublicationSelection();
                loadPublications(currentPage, currentSearch, currentType, currentStatus);
            } catch (error) {
                console.error('批量更新论文状态失败:', error);
                AdminUtils.showNotification('批量更新失败，请稍后重试', 'error');
            }
        }

        function normalizeTypes(pub) {
            if (Array.isArray(pub.types)) {
                return pub.types;
            }
            if (typeof pub.types === 'string' && pub.types.trim()) {
                const raw = pub.types.trim();
                try {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed;
                } catch (_) {
                    return raw.split(',').map(x => x.trim()).filter(Boolean);
                }
            }
            if (pub.type) {
                return [pub.type];
            }
            return [];
        }

        function typeText(type) {
            const map = {
                SCI: 'SCI',
                EI: 'EI',
                Conference: '国际会议',
                DomesticConference: '国内会议'
            };
            return map[type] || type;
        }

        function renderTypeBadges(pub) {
            const tags = normalizeTypes(pub);
            if (!tags.length) {
                return '';
            }
            return `
                <div style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.35rem;">
                    ${tags.map(tag => `<span class="status-badge status-success" style="font-size:0.68rem;">${typeText(tag)}</span>`).join('')}
                </div>
            `;
        }
        
        // 加载论文列表
        async function loadPublications(page = 1, search = '', type = '', status = '') {
            try {
                const params = new URLSearchParams({
                    page: page.toString(),
                    limit: '10',
                    ...(search && { search }),
                    ...(type && { type }),
                    ...(status && { status })
                });
                
                const response = await AdminUtils.apiRequest(`/publications?${params}`);
                const publications = response.publications || response.data || [];
                const totalPages = response.totalPages ?? response.pagination?.totalPages ?? 1;
                const currentPageFromResponse = response.currentPage ?? response.pagination?.currentPage ?? page;
                const tbody = document.getElementById('publications-tbody');
                
                if (publications.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="${getTableColumnSpan()}" style="text-align: center; padding: 2rem; color: #64748b;">
                                ${(search || type || status) ? '未找到匹配的论文' : '暂无论文数据'}
                            </td>
                        </tr>
                    `;
                    resetPublicationSelection();
                    return;
                }
                
                tbody.innerHTML = publications.map(pub => `
                    <tr>
                        ${isAdmin ? `<td><input type="checkbox" class="publication-row-select" data-id="${pub.id}"></td>` : ''}
                        <td>
                            <div style="font-weight: 500; line-height: 1.4;">${pub.title}</div>
                            ${pub.doi ? `<div style="font-size: 0.75rem; color: #64748b;">DOI: ${pub.doi}</div>` : ''}
                            ${renderTypeBadges(pub)}
                        </td>
                        <td>${pub.authors}</td>
                        <td>${pub.journal}</td>
                        <td>${pub.year}</td>
                        <td>
                            <span class="status-badge ${getStatusClass(pub.status)}" style="white-space: nowrap;">
                                ${getStatusText(pub.status)}
                            </span>
                        </td>
                        <td>
                            <div style="display:flex; flex-direction:column; gap:0.45rem;">
                                <div style="display:flex; gap:0.45rem;">
                                    <button class="btn btn-small btn-secondary" onclick="editPublication(${pub.id})">
                                        编辑
                                    </button>
                                    ${isAdmin ? `<button class="btn btn-small btn-danger" onclick="deletePublication(${pub.id})">删除</button>` : ''}
                                </div>
                                <button class="btn btn-small btn-secondary" style="width: 100%;" onclick="copyPublicationsFrontendLink()">
                                    复制前台链接
                                </button>
                                ${pub.pdf_url ? `<a class="btn btn-small btn-secondary" style="width:100%; text-align:center;" href="${pub.pdf_url}" target="_blank">下载PDF</a>` : ''}
                            </div>
                        </td>
                    </tr>
                `).join('');
                resetPublicationSelection();
                
                // 更新分页
                const paginationContainer = document.getElementById('pagination-container');
                if (totalPages > 1) {
                    const pagination = AdminUtils.createPagination(
                        currentPageFromResponse,
                        totalPages,
                        (page) => {
                            currentPage = page;
                            loadPublications(page, currentSearch, currentType, currentStatus);
                        }
                    );
                    paginationContainer.innerHTML = '';
                    paginationContainer.appendChild(pagination);
                } else {
                    paginationContainer.innerHTML = '';
                }
                
            } catch (error) {
                console.error('加载论文列表失败:', error);
                AdminUtils.showNotification('加载失败，请稍后重试', 'error');
            }
        }
        
        // 获取状态样式类
        function getStatusClass(status) {
            const statusMap = {
                published: 'status-success',
                pending_review: 'status-warning',
                scheduled: 'status-warning',
                draft: 'status-error'
            };
            return statusMap[status] || 'status-error';
        }
        
        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                published: '已发布',
                pending_review: '待审核',
                scheduled: '定时发布',
                draft: '草稿'
            };
            return statusMap[status] || status;
        }
        
        // 显示添加论文模态框
        function showAddModal() {
            const modal = document.getElementById('publication-modal');
            const form = document.getElementById('publication-form');
            const title = document.getElementById('modal-title');
            
            title.textContent = isAdmin ? '添加论文' : '提交论文';
            form.reset();
            document.getElementById('publication-id').value = '';
            
            // 设置默认年份为当前年份
            document.getElementById('year').value = new Date().getFullYear();
            document.getElementById('status').value = isAdmin ? 'draft' : 'pending_review';
            updateScheduledFieldVisibility();
            
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        // 编辑论文
        async function editPublication(id) {
            try {
                const publication = await AdminUtils.apiRequest(`/publications/${id}`);
                
                const modal = document.getElementById('publication-modal');
                const form = document.getElementById('publication-form');
                const title = document.getElementById('modal-title');
                
                title.textContent = isAdmin ? '编辑论文' : '编辑论文（提交审核）';
                
                // 填充表单数据
                Object.keys(publication).forEach(key => {
                    const element = form.querySelector(`[name="${key}"]`);
                    if (element) {
                        if (key === 'scheduled_publish_at' && publication[key]) {
                            element.value = toDatetimeLocalValue(publication[key]);
                        } else {
                            element.value = publication[key] || '';
                        }
                    }
                });
                // 回填多选 types（兼容 legacy type）
                const types = Array.isArray(publication.types) ? publication.types : (publication.type ? [publication.type] : []);
                form.querySelectorAll('input[name="types"]').forEach(cb => {
                    cb.checked = types.includes(cb.value);
                });

                if (!isAdmin) {
                    document.getElementById('status').value = 'pending_review';
                }
                updateScheduledFieldVisibility();
                
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
                
            } catch (error) {
                console.error('加载论文数据失败:', error);
                AdminUtils.showNotification('加载失败，请稍后重试', 'error');
            }
        }
        
        // 删除论文
        async function deletePublication(id) {
            if (!isAdmin) {
                AdminUtils.showNotification('仅管理员可删除论文', 'error');
                return;
            }

            const confirmed = await AdminUtils.showConfirm('确定要删除这篇论文吗？此操作不可撤销。');
            if (!confirmed) return;
            
            try {
                await AdminUtils.apiRequest(`/publications/${id}`, {
                    method: 'DELETE'
                });
                
                AdminUtils.showNotification('论文删除成功', 'success');
                loadPublications(currentPage, currentSearch, currentType, currentStatus);
                
            } catch (error) {
                console.error('删除论文失败:', error);
                AdminUtils.showNotification('删除失败，请稍后重试', 'error');
            }
        }

        // 复制论文前台入口链接
        async function copyPublicationsFrontendLink() {
            const frontendUrl = `${window.location.origin}/publications-api.html`;
            try {
                await navigator.clipboard.writeText(frontendUrl);
                AdminUtils.showNotification('前台论文页链接已复制', 'success');
            } catch (error) {
                console.error('复制链接失败:', error);
                AdminUtils.showNotification('复制失败，请手动复制地址栏链接', 'error');
            }
        }
        
        // 隐藏模态框
        function hideModal() {
            const modal = document.getElementById('publication-modal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        
        // 表单提交
        document.getElementById('publication-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const id = formData.get('id');
            const isEdit = !!id;
            
            // 表单验证
            const isValid = AdminUtils.validateForm(form, {
                title: { required: true, message: '请输入论文标题' },
                authors: { required: true, message: '请输入作者信息' },
                journal: { required: true, message: '请输入期刊名称' },
                year: { required: true, message: '请输入发表年份' }
            });
            
            if (!isValid) return;
            
            const saveBtn = document.getElementById('save-btn');
            const saveText = document.getElementById('save-text');
            const saveLoading = document.getElementById('save-loading');

            if (isAdmin && formData.get('status') === 'scheduled' && !formData.get('scheduled_publish_at')) {
                AdminUtils.showNotification('请选择定时发布时间', 'error');
                return;
            }

            if (!isAdmin) {
                formData.set('status', 'pending_review');
            }
            
            // 显示加载状态
            saveBtn.disabled = true;
            saveText.style.display = 'none';
            saveLoading.style.display = 'flex';
            
            try {
                const data = Object.fromEntries(formData);
                delete data.id; // 移除ID字段
                // 收集多选 types
                const typeValues = [];
                form.querySelectorAll('input[name="types"]:checked').forEach(cb => typeValues.push(cb.value));
                if (typeValues.length) data.types = typeValues;
                
                const url = isEdit ? `/publications/${id}` : '/publications';
                const method = isEdit ? 'PUT' : 'POST';
                
                const result = await AdminUtils.apiRequest(url, {
                    method,
                    body: data
                });
                
                AdminUtils.showNotification(
                    isEdit ? (isAdmin ? '论文更新成功' : '论文已更新并提交审核') : (isAdmin ? '论文添加成功' : '论文已提交审核'),
                    'success'
                );

                const frontendUrl = result?.frontend_url || '/publications-api.html';
                const absoluteUrl = `${window.location.origin}${frontendUrl}`;
                if (!isEdit) {
                    try {
                        await navigator.clipboard.writeText(absoluteUrl);
                        AdminUtils.showNotification('已复制前台论文页链接', 'success');
                    } catch (_) {
                        // 忽略剪贴板失败，保留后续打开流程
                    }
                }

                if (confirm('是否立即在新标签页打开前台论文页检查展示效果？')) {
                    window.open(frontendUrl, '_blank', 'noopener,noreferrer');
                }
                
                hideModal();
                loadPublications(currentPage, currentSearch, currentType, currentStatus);
                
            } catch (error) {
                console.error('保存论文失败:', error);
                AdminUtils.showNotification('保存失败，请稍后重试', 'error');
            } finally {
                // 恢复按钮状态
                saveBtn.disabled = false;
                saveText.style.display = 'block';
                saveLoading.style.display = 'none';
            }
        });

        // 上传PDF
        document.getElementById('upload-pdf-btn').addEventListener('click', () => {
            document.getElementById('pdf-input').click();
        });
        document.getElementById('pdf-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const id = document.getElementById('publication-id').value;
            if (!id) {
                AdminUtils.showNotification('请先保存论文，再上传PDF', 'error');
                return;
            }
            try {
                const formData = new FormData();
                formData.append('pdf', file);
                const token = AdminUtils.getToken();
                const resp = await fetch(`/api/admin/publications/${id}/upload-pdf`, {
                    method: 'POST',
                    headers: { ...(token && { 'Authorization': `Bearer ${token}` }) },
                    body: formData
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || '上传失败');
                AdminUtils.showNotification('PDF上传成功', 'success');
                hideModal();
                loadPublications(currentPage, currentSearch, currentType, currentStatus);
            } catch (err) {
                console.error('PDF上传失败:', err);
                AdminUtils.showNotification('PDF上传失败，请稍后重试', 'error');
            }
        });
        
        // 事件监听
        document.getElementById('add-publication-btn').addEventListener('click', showAddModal);
        document.getElementById('cancel-btn').addEventListener('click', hideModal);
        document.getElementById('status').addEventListener('change', updateScheduledFieldVisibility);
        
        // 搜索功能
        const searchInput = document.getElementById('search-input');
        const debouncedSearch = AdminUtils.debounce((search) => {
            currentSearch = search;
            currentPage = 1;
            loadPublications(1, search, currentType, currentStatus);
        }, 300);
        
        searchInput.addEventListener('input', (e) => {
            debouncedSearch(e.target.value.trim());
        });

        document.getElementById('type-filter').addEventListener('change', (e) => {
            currentType = e.target.value;
            currentPage = 1;
            loadPublications(1, currentSearch, currentType, currentStatus);
        });

        document.getElementById('status-filter').addEventListener('change', (e) => {
            currentStatus = e.target.value;
            currentPage = 1;
            loadPublications(1, currentSearch, currentType, currentStatus);
        });

        document.getElementById('select-all-publications').addEventListener('change', (e) => {
            const checked = e.target.checked;
            document.querySelectorAll('.publication-row-select').forEach((cb) => {
                cb.checked = checked;
                const id = Number.parseInt(cb.dataset.id, 10);
                if (!Number.isFinite(id)) return;
                if (checked) {
                    selectedPublicationIds.add(id);
                } else {
                    selectedPublicationIds.delete(id);
                }
            });
            syncPublicationSelectionControls();
        });

        document.getElementById('publications-tbody').addEventListener('change', (e) => {
            if (!e.target.classList.contains('publication-row-select')) {
                return;
            }
            const id = Number.parseInt(e.target.dataset.id, 10);
            if (!Number.isFinite(id)) return;
            if (e.target.checked) {
                selectedPublicationIds.add(id);
            } else {
                selectedPublicationIds.delete(id);
            }
            syncPublicationSelectionControls();
        });

        document.getElementById('bulk-status').addEventListener('change', () => {
            syncPublicationSelectionControls();
        });

        document.getElementById('bulk-apply-btn').addEventListener('click', applyBulkPublicationStatus);
        
        // 模态框点击外部关闭
        document.getElementById('publication-modal').addEventListener('click', (e) => {
            if (e.target.id === 'publication-modal') {
                hideModal();
            }
        });
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            applyRoleControls();
            applyInitialFiltersFromQuery();
            syncPublicationSelectionControls();
            loadPublications(1, currentSearch, currentType, currentStatus);
        });
        
        // 暴露函数到全局作用域
        window.editPublication = editPublication;
        window.deletePublication = deletePublication;
        window.copyPublicationsFrontendLink = copyPublicationsFrontendLink;
    </script>
</body>
</html>

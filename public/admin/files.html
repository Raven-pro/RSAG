<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理 - RSAG</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>RSAG 管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-role="admin">
                    📊 仪表板
                </a>
                <a href="publications.html" class="nav-item" data-role="admin">
                    📚 论文管理
                </a>
                <a href="news.html" class="nav-item">
                    📰 新闻管理
                </a>
                <a href="team.html" class="nav-item" data-role="admin">
                    👥 团队管理
                </a>
                <a href="files.html" class="nav-item active" data-role="admin">
                    📁 文件管理
                </a>
                <a href="users.html" class="nav-item" data-role="admin">
                    🔐 账号管理
                </a>
                <button class="nav-item logout">
                    🚪 退出登录
                </button>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="content-header">
                <h1>文件管理</h1>
                <p>管理课题组的图片、文档和其他资源文件</p>
            </div>

            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="搜索文件名..." id="search-input">
                        <div class="search-icon">🔍</div>
                    </div>
                    <select id="type-filter" class="form-select" style="width: auto; margin-left: 1rem;">
                        <option value="">所有类型</option>
                        <option value="image">图片</option>
                        <option value="document">文档</option>
                        <option value="avatar">头像</option>
                        <option value="news">新闻图片</option>
                        <option value="general">其他</option>
                    </select>
                    <select id="status-filter" class="form-select" style="width: auto; margin-left: 1rem;">
                        <option value="active">当前文件</option>
                        <option value="orphan">孤儿文件</option>
                        <option value="pending_delete">回收站</option>
                        <option value="all">全部状态</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <button class="btn btn-secondary" id="cleanup-trash-btn">
                        🧹 清理回收站
                    </button>
                    <button class="btn btn-primary" id="upload-btn">
                        📤 上传文件
                    </button>
                </div>
            </div>

            <!-- 上传区域 -->
            <div id="upload-area" class="card" style="display: none; margin-bottom: 2rem;">
                <div class="card-header">
                    <h3>上传文件</h3>
                </div>
                <div class="card-body">
                    <div style="border: 2px dashed #cbd5e1; border-radius: 8px; padding: 2rem; text-align: center; background: #f8fafc;" id="drop-zone">
                        <div style="margin-bottom: 1rem;">
                            <span style="font-size: 3rem;">📁</span>
                        </div>
                        <p style="margin: 0 0 1rem 0; color: #64748b;">拖拽文件到此处或点击选择文件</p>
                        <p style="margin: 0 0 1rem 0; color: #64748b; font-size: 0.8rem;">图片上限 2MB，PDF 上限 12MB，超限将自动在线压缩（若仍超限会提示）。</p>
                        <button type="button" class="btn btn-secondary" id="select-files-btn">选择文件</button>
                        <input type="file" id="file-input" multiple accept="image/*,application/pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" style="display: none;">
                    </div>
                    
                    <div id="upload-progress" style="display: none; margin-top: 1rem;">
                        <div style="background: #e2e8f0; border-radius: 4px; overflow: hidden;">
                            <div id="progress-bar" style="background: var(--tsinghua-purple); height: 8px; width: 0%; transition: width 0.3s ease;"></div>
                        </div>
                        <p style="margin: 0.5rem 0 0 0; font-size: 0.875rem; color: #64748b;" id="upload-status">准备上传...</p>
                    </div>
                    
                    <div style="display: flex; gap: 1rem; margin-top: 1rem; justify-content: flex-end;">
                        <button type="button" class="btn btn-secondary" id="cancel-upload-btn">取消</button>
                        <button type="button" class="btn btn-primary" id="start-upload-btn" disabled>开始上传</button>
                    </div>
                </div>
            </div>

            <!-- 文件列表 -->
            <div class="card">
                <div class="card-body">
                    <div id="files-sections" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- 加载状态 -->
                        <div id="loading-placeholder" style="grid-column: 1 / -1; text-align: center; padding: 2rem;">
                            <div class="spinner" style="margin: 0 auto 1rem;"></div>
                            加载中...
                        </div>
                    </div>
                    <div id="pagination-container"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 文件详情模态框 -->
    <div id="file-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; overflow-y: auto;">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="background: white; border-radius: 8px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;">
                <div class="card-header">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>文件详情</h3>
                        <button type="button" class="btn btn-small btn-secondary" id="close-file-modal">
                            ✖️ 关闭
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="file-details"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        let currentPage = 1;
        let currentSearch = '';
        let currentType = '';
        let currentStatus = 'active';
        let selectedFiles = [];

        function flashFileCards(fileIds = []) {
            fileIds.forEach((rawId) => {
                const id = Number.parseInt(rawId, 10);
                if (!Number.isInteger(id) || id <= 0) return;
                const cards = document.querySelectorAll(`#files-sections [data-file-id="${id}"]`);
                cards.forEach((card) => AdminUtils.flashElement(card));
            });
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function summarizeReferenceLocations(references = []) {
            const counter = new Map();
            references.forEach((item) => {
                const label = String(item?.location_label || item?.field_name || '引用位置').trim();
                if (!label) return;
                counter.set(label, (counter.get(label) || 0) + 1);
            });

            return Array.from(counter.entries())
                .map(([label, count]) => `${escapeHtml(label)} x${count}`)
                .join('，');
        }

        function renderFileReferenceSummary(file) {
            const groups = file?.reference_groups || {};
            const sections = [
                { key: 'news', label: '新闻' },
                { key: 'team_members', label: '成员' },
                { key: 'publications', label: '论文' }
            ];

            const total = Number(file?.reference_breakdown?.total || file?.reference_count || 0);
            if (!Number.isFinite(total) || total <= 0) {
                return '<div style="margin-top:0.55rem; font-size:0.72rem; color:#94a3b8; border-top:1px dashed #e2e8f0; padding-top:0.45rem;">未被新闻/成员/论文引用</div>';
            }

            const lines = sections.map((section) => {
                const refs = Array.isArray(groups[section.key]) ? groups[section.key] : [];
                if (!refs.length) {
                    return `<div><span style="color:#334155;">${section.label}：</span><span style="color:#94a3b8;">无</span></div>`;
                }
                const locationSummary = summarizeReferenceLocations(refs);
                return `<div><span style="color:#334155;">${section.label}：</span>${locationSummary}</div>`;
            }).join('');

            return `
                <div style="margin-top:0.55rem; font-size:0.72rem; color:#475569; border-top:1px dashed #e2e8f0; padding-top:0.45rem; line-height:1.45;">
                    ${lines}
                </div>
            `;
        }

        function renderReferenceGroupSection(title, refs = []) {
            if (!Array.isArray(refs) || refs.length === 0) {
                return `
                    <div style="margin-top:0.8rem;">
                        <div style="font-weight:600; color:#334155; margin-bottom:0.35rem;">${title}</div>
                        <div style="color:#94a3b8; font-size:0.82rem;">暂无引用</div>
                    </div>
                `;
            }

            return `
                <div style="margin-top:0.8rem;">
                    <div style="font-weight:600; color:#334155; margin-bottom:0.35rem;">${title}（${refs.length}）</div>
                    <ul style="margin:0; padding-left:1.1rem; color:#475569; font-size:0.84rem; line-height:1.55;">
                        ${refs.map((ref) => {
                            const name = escapeHtml(ref.entity_name || '未命名记录');
                            const location = escapeHtml(ref.location_label || ref.field_name || '引用位置');
                            const adminLink = ref.entity_admin_url
                                ? `<a href="${ref.entity_admin_url}" target="_blank" rel="noopener noreferrer" style="color:#2563eb; text-decoration:underline; margin-left:0.4rem;">后台</a>`
                                : '';
                            const frontLink = ref.entity_front_url
                                ? `<a href="${ref.entity_front_url}" target="_blank" rel="noopener noreferrer" style="color:#2563eb; text-decoration:underline; margin-left:0.4rem;">前台</a>`
                                : '';

                            return `<li><span>${name}</span><span style="color:#64748b;"> · ${location}</span>${adminLink}${frontLink}</li>`;
                        }).join('')}
                    </ul>
                </div>
            `;
        }

        function renderFileReferenceDetails(file) {
            const groups = file?.reference_groups || {};
            const total = Number(file?.reference_breakdown?.total || file?.reference_count || 0);

            if (!Number.isFinite(total) || total <= 0) {
                return `
                    <div style="margin-top:1.2rem; border-top:1px solid #e2e8f0; padding-top:1rem;">
                        <h4 style="margin:0 0 0.6rem 0; color:#1e293b;">引用位置</h4>
                        <div style="color:#94a3b8; font-size:0.85rem;">该文件当前未被新闻、成员或论文引用。</div>
                    </div>
                `;
            }

            return `
                <div style="margin-top:1.2rem; border-top:1px solid #e2e8f0; padding-top:1rem;">
                    <h4 style="margin:0; color:#1e293b;">引用位置</h4>
                    ${renderReferenceGroupSection('新闻', groups.news || [])}
                    ${renderReferenceGroupSection('成员', groups.team_members || [])}
                    ${renderReferenceGroupSection('论文', groups.publications || [])}
                </div>
            `;
        }

        function renderFileCard(file) {
            return `
                <div class="card" data-file-id="${file.id}" style="cursor: pointer;" onclick="viewFile(${file.id})">
                    <div style="aspect-ratio: 1; overflow: hidden; border-radius: 8px 8px 0 0; background: #f1f5f9; display: flex; align-items: center; justify-content: center;">
                        ${file.file_type.startsWith('image/')
                            ? `<img src="${file.file_url}" alt="${file.original_name}" style="width: 100%; height: 100%; object-fit: cover;">`
                            : `<div style="font-size: 3rem;">${getFileIcon(file.file_type)}</div>`
                        }
                    </div>
                    <div class="card-body" style="padding: 1rem;">
                        <h4 style="margin: 0 0 0.5rem 0; font-size: 0.875rem; font-weight: 500; color: #1e293b; word-break: break-all;">
                            ${file.original_name.length > 25 ? file.original_name.substring(0, 25) + '...' : file.original_name}
                        </h4>
                        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: #64748b;">
                            <span>${formatFileSize(file.file_size)}</span>
                            <span>${AdminUtils.formatDate(file.created_at)}</span>
                        </div>
                        <div style="margin-top: 0.5rem;">
                            <span class="status-badge status-success" style="font-size: 0.65rem;">
                                ${getFileTypeText(file.file_type)}
                            </span>
                            ${file.lifecycle_status === 'pending_delete' ? '<span class="status-badge status-warning" style="font-size:0.65rem; margin-left:0.35rem;">回收站</span>' : ''}
                            ${file.is_orphan ? '<span class="status-badge status-error" style="font-size:0.65rem; margin-left:0.35rem;">孤儿</span>' : ''}
                        </div>
                        ${renderFileReferenceSummary(file)}
                        <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
                            <button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); copyFileUrl('${file.file_url}')">
                                复制链接
                            </button>
                            ${file.lifecycle_status === 'pending_delete'
                                ? `<button class="btn btn-small btn-secondary" onclick="event.stopPropagation(); restoreFile(${file.id})">恢复</button>
                                   <button class="btn btn-small btn-danger" onclick="event.stopPropagation(); hardDeleteFile(${file.id})">彻底删除</button>`
                                : `<button class="btn btn-small btn-danger" onclick="event.stopPropagation(); deleteFile(${file.id})">移入回收站</button>`
                            }
                        </div>
                    </div>
                </div>
            `;
        }

        function renderFileSection(sectionTitle, files = [], emptyText = '暂无文件') {
            return `
                <div class="card">
                    <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <h3 style="margin:0; font-size:1rem;">${sectionTitle}</h3>
                        <span class="status-badge status-info">${files.length}</span>
                    </div>
                    <div class="card-body">
                        ${files.length > 0
                            ? `<div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem;">${files.map((file) => renderFileCard(file)).join('')}</div>`
                            : `<div style="text-align:center; color:#94a3b8; padding:1rem 0;">${emptyText}</div>`
                        }
                    </div>
                </div>
            `;
        }
        
        // 加载文件列表
        async function loadFiles(page = 1, search = '', type = '', status = 'active', highlightFileIds = []) {
            try {
                const params = new URLSearchParams({
                    grouped: '1',
                    ...(search && { search }),
                    ...(type && { type }),
                    ...(status && { status })
                });
                
                const response = await AdminUtils.apiRequest(`/files?${params}`);
                const sectionsContainer = document.getElementById('files-sections');
                const loadingPlaceholder = document.getElementById('loading-placeholder');
                
                if (loadingPlaceholder) {
                    loadingPlaceholder.remove();
                }

                const sections = response.sections || {};
                const newsFiles = Array.isArray(sections.news) ? sections.news : [];
                const teamFiles = Array.isArray(sections.team_members) ? sections.team_members : [];
                const publicationFiles = Array.isArray(sections.publications) ? sections.publications : [];
                const unreferencedFiles = Array.isArray(sections.unreferenced) ? sections.unreferenced : [];

                const totalShown = newsFiles.length + teamFiles.length + publicationFiles.length + unreferencedFiles.length;
                
                if (totalShown === 0) {
                    sectionsContainer.innerHTML = `
                        <div style="text-align: center; padding: 3rem; color: #64748b;">
                            ${(search || type || status !== 'active') ? '未找到匹配的文件' : '暂无文件'}
                        </div>
                    `;
                    document.getElementById('pagination-container').innerHTML = '';
                    return;
                }

                sectionsContainer.innerHTML = `
                    ${renderFileSection('新闻引用区', newsFiles, '暂无被新闻引用的文件')}
                    ${renderFileSection('成员引用区', teamFiles, '暂无被成员引用的文件')}
                    ${renderFileSection('论文引用区', publicationFiles, '暂无被论文引用的文件')}
                    ${renderFileSection('未引用 / 其他', unreferencedFiles, '暂无未引用文件')}
                `;
                flashFileCards(highlightFileIds);
                document.getElementById('pagination-container').innerHTML = '';
                
            } catch (error) {
                console.error('加载文件列表失败:', error);
                AdminUtils.showNotification('加载失败，请稍后重试', 'error');
            }
        }
        
        // 获取文件图标
        function getFileIcon(fileType) {
            if (fileType.startsWith('image/')) return '🖼️';
            if (fileType.includes('pdf')) return '📄';
            if (fileType.includes('word') || fileType.includes('document')) return '📝';
            if (fileType.includes('excel') || fileType.includes('spreadsheet')) return '📊';
            if (fileType.includes('powerpoint') || fileType.includes('presentation')) return '📋';
            return '📁';
        }
        
        // 获取文件类型文本
        function getFileTypeText(fileType) {
            if (fileType.startsWith('image/')) return '图片';
            if (fileType.includes('pdf')) return 'PDF';
            if (fileType.includes('word')) return 'Word';
            if (fileType.includes('excel')) return 'Excel';
            if (fileType.includes('powerpoint')) return 'PPT';
            return '文档';
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        
        // 显示上传区域
        function showUploadArea() {
            const uploadArea = document.getElementById('upload-area');
            uploadArea.style.display = 'block';
            selectedFiles = [];
            updateUploadButtons();
        }
        
        // 隐藏上传区域
        function hideUploadArea() {
            const uploadArea = document.getElementById('upload-area');
            const progressArea = document.getElementById('upload-progress');
            uploadArea.style.display = 'none';
            progressArea.style.display = 'none';
            selectedFiles = [];
        }
        
        // 处理文件选择
        function handleFileSelect(files) {
            selectedFiles = Array.from(files);
            updateUploadButtons();
            
            if (selectedFiles.length > 0) {
                const dropZone = document.getElementById('drop-zone');
                dropZone.innerHTML = `
                    <div style="margin-bottom: 1rem;">
                        <span style="font-size: 3rem;">📁</span>
                    </div>
                    <p style="margin: 0 0 1rem 0; color: #64748b;">已选择 ${selectedFiles.length} 个文件</p>
                    <div style="font-size: 0.875rem; color: #64748b;">
                        ${selectedFiles.map(file => file.name).join(', ')}
                    </div>
                `;
            }
        }
        
        // 更新上传按钮状态
        function updateUploadButtons() {
            const startBtn = document.getElementById('start-upload-btn');
            startBtn.disabled = selectedFiles.length === 0;
        }
        
        // 开始上传
        async function startUpload() {
            if (selectedFiles.length === 0) return;
            
            const progressArea = document.getElementById('upload-progress');
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('upload-status');
            const startBtn = document.getElementById('start-upload-btn');
            
            progressArea.style.display = 'block';
            startBtn.disabled = true;
            
            let uploaded = 0;
            const total = selectedFiles.length;
            const uploadedFileIds = [];
            
            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    statusText.textContent = `正在上传: ${file.name} (${i + 1}/${total})`;
                    
                    const uploadResult = await AdminUtils.uploadFile(file, 'general');
                    const fileId = Number.parseInt(uploadResult?.file?.id, 10);
                    if (Number.isInteger(fileId) && fileId > 0) {
                        uploadedFileIds.push(fileId);
                    }
                    
                    uploaded++;
                    const progress = (uploaded / total) * 100;
                    progressBar.style.width = `${progress}%`;
                }
                
                statusText.textContent = '上传完成！';
                AdminUtils.showNotification('文件上传成功', 'success');

                hideUploadArea();
                await loadFiles(currentPage, currentSearch, currentType, currentStatus, uploadedFileIds);
                
            } catch (error) {
                console.error('文件上传失败:', error);
                statusText.textContent = '上传失败';
                AdminUtils.showNotification('文件上传失败，请稍后重试', 'error');
                startBtn.disabled = false;
            }
        }
        
        // 查看文件
        async function viewFile(id) {
            try {
                const file = await AdminUtils.apiRequest(`/files/${id}`);
                
                const detailsContainer = document.getElementById('file-details');
                detailsContainer.innerHTML = `
                    <div style="text-align: center; margin-bottom: 2rem;">
                        ${file.file_type.startsWith('image/') ? 
                            `<img src="${file.file_url}" alt="${file.original_name}" style="max-width: 100%; max-height: 300px; border-radius: 8px;">` :
                            `<div style="font-size: 4rem; margin: 2rem 0;">${getFileIcon(file.file_type)}</div>`
                        }
                    </div>
                    
                    <div style="space-y: 1rem;">
                        <div>
                            <strong>文件名:</strong> ${file.original_name}
                        </div>
                        <div>
                            <strong>类型:</strong> ${getFileTypeText(file.file_type)}
                        </div>
                        <div>
                            <strong>大小:</strong> ${formatFileSize(file.file_size)}
                        </div>
                        <div>
                            <strong>上传时间:</strong> ${AdminUtils.formatDate(file.created_at)}
                        </div>
                        <div>
                            <strong>上传者:</strong> ${file.uploaded_by}
                        </div>
                        <div>
                            <strong>状态:</strong> ${file.lifecycle_status === 'pending_delete' ? '回收站' : '正常'}
                        </div>
                        <div>
                            <strong>引用数:</strong> ${Number(file.reference_count) || 0}
                        </div>
                        ${file.deleted_at ? `<div><strong>删除时间:</strong> ${AdminUtils.formatDate(file.deleted_at)}</div>` : ''}
                        ${file.deleted_by ? `<div><strong>删除人:</strong> ${file.deleted_by}</div>` : ''}
                        ${renderFileReferenceDetails(file)}
                        <div style="margin-top: 1.5rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">文件链接:</label>
                            <div style="display: flex; gap: 0.5rem;">
                                <input type="text" value="${file.file_url}" readonly class="form-input" style="flex: 1;">
                                <button class="btn btn-secondary" onclick="copyFileUrl('${file.file_url}')">复制</button>
                            </div>
                        </div>
                        ${file.lifecycle_status === 'pending_delete' ? `
                            <div style="margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
                                <button class="btn btn-secondary" onclick="restoreFile(${file.id})">恢复此文件</button>
                                <button class="btn btn-danger" onclick="hardDeleteFile(${file.id})">彻底删除</button>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                document.getElementById('file-modal').style.display = 'block';
                
            } catch (error) {
                console.error('加载文件详情失败:', error);
                AdminUtils.showNotification('加载失败，请稍后重试', 'error');
            }
        }
        
        // 复制文件URL
        function copyFileUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                AdminUtils.showNotification('链接已复制到剪贴板', 'success');
            }).catch(() => {
                AdminUtils.showNotification('复制失败，请手动复制', 'error');
            });
        }
        
        // 删除文件
        async function deleteFile(id) {
            const confirmed = await AdminUtils.showConfirm('确定将这个文件移入回收站吗？');
            if (!confirmed) return;
            
            try {
                await AdminUtils.apiRequest(`/files/${id}`, {
                    method: 'DELETE'
                });
                
                AdminUtils.showNotification('文件已移入回收站', 'success');
                loadFiles(currentPage, currentSearch, currentType, currentStatus);
                
            } catch (error) {
                console.error('删除文件失败:', error);
                AdminUtils.showNotification(error.message || '删除失败，请稍后重试', 'error');
            }
        }

        async function restoreFile(id) {
            try {
                await AdminUtils.apiRequest('/files/restore', {
                    method: 'POST',
                    body: { id }
                });

                AdminUtils.showNotification('文件恢复成功', 'success');
                document.getElementById('file-modal').style.display = 'none';
                loadFiles(currentPage, currentSearch, currentType, currentStatus);
            } catch (error) {
                console.error('恢复文件失败:', error);
                AdminUtils.showNotification(error.message || '恢复失败，请稍后重试', 'error');
            }
        }

        async function hardDeleteFile(id) {
            const confirmed = await AdminUtils.showConfirm('确定彻底删除该文件吗？此操作不可恢复。');
            if (!confirmed) return;

            try {
                await AdminUtils.apiRequest(`/files/${id}?hard=true`, {
                    method: 'DELETE'
                });

                AdminUtils.showNotification('文件已彻底删除', 'success');
                document.getElementById('file-modal').style.display = 'none';
                loadFiles(currentPage, currentSearch, currentType, currentStatus);
            } catch (error) {
                console.error('彻底删除文件失败:', error);
                AdminUtils.showNotification(error.message || '彻底删除失败，请稍后重试', 'error');
            }
        }

        async function cleanupTrash() {
            const input = prompt('请输入保留天数（0=立即清空，默认 7 天）', '7');
            if (input === null) return;

            const keepDays = Number.parseInt(String(input).trim() || '7', 10);
            const safeKeepDays = Number.isInteger(keepDays) ? keepDays : 7;
            const confirmed = safeKeepDays === 0
                ? await AdminUtils.showConfirm('确认立即清空回收站吗？该操作不可恢复。')
                : await AdminUtils.showConfirm(`确认清理回收站中超过 ${safeKeepDays} 天的文件吗？`);
            if (!confirmed) return;

            try {
                const result = await AdminUtils.apiRequest('/files/cleanup', {
                    method: 'POST',
                    body: { keepDays: safeKeepDays }
                });

                AdminUtils.showNotification(result.message || '回收站清理完成', 'success');
                loadFiles(currentPage, currentSearch, currentType, currentStatus);
            } catch (error) {
                console.error('清理回收站失败:', error);
                AdminUtils.showNotification(error.message || '清理失败，请稍后重试', 'error');
            }
        }
        
        // 事件监听
        document.getElementById('upload-btn').addEventListener('click', showUploadArea);
        document.getElementById('cleanup-trash-btn').addEventListener('click', cleanupTrash);
        document.getElementById('cancel-upload-btn').addEventListener('click', hideUploadArea);
        document.getElementById('start-upload-btn').addEventListener('click', startUpload);
        document.getElementById('select-files-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });
        document.getElementById('close-file-modal').addEventListener('click', () => {
            document.getElementById('file-modal').style.display = 'none';
        });
        
        // 文件选择
        document.getElementById('file-input').addEventListener('change', (e) => {
            handleFileSelect(e.target.files);
        });
        
        // 拖拽上传
        const dropZone = document.getElementById('drop-zone');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--tsinghua-purple)';
            dropZone.style.backgroundColor = '#f8f4ff';
        });
        
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#cbd5e1';
            dropZone.style.backgroundColor = '#f8fafc';
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#cbd5e1';
            dropZone.style.backgroundColor = '#f8fafc';
            handleFileSelect(e.dataTransfer.files);
        });
        
        // 搜索和筛选
        const searchInput = document.getElementById('search-input');
        const typeFilter = document.getElementById('type-filter');
        const statusFilter = document.getElementById('status-filter');
        
        const debouncedSearch = AdminUtils.debounce(() => {
            currentSearch = searchInput.value.trim();
            currentType = typeFilter.value;
            currentStatus = statusFilter.value;
            currentPage = 1;
            loadFiles(1, currentSearch, currentType, currentStatus);
        }, 300);
        
        searchInput.addEventListener('input', debouncedSearch);
        typeFilter.addEventListener('change', debouncedSearch);
        statusFilter.addEventListener('change', debouncedSearch);
        
        // 模态框点击外部关闭
        document.getElementById('file-modal').addEventListener('click', (e) => {
            if (e.target.id === 'file-modal') {
                document.getElementById('file-modal').style.display = 'none';
            }
        });
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            loadFiles(1, currentSearch, currentType, currentStatus);
        });
        
        // 暴露函数到全局作用域
        window.viewFile = viewFile;
        window.copyFileUrl = copyFileUrl;
        window.deleteFile = deleteFile;
        window.restoreFile = restoreFile;
        window.hardDeleteFile = hardDeleteFile;
    </script>
</body>
</html>

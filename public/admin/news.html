<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻管理 - RSAG</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>RSAG 管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    📊 仪表板
                </a>
                <a href="publications.html" class="nav-item">
                    📚 论文管理
                </a>
                <a href="news.html" class="nav-item active">
                    📰 新闻管理
                </a>
                <a href="team.html" class="nav-item">
                    👥 团队管理
                </a>
                <a href="files.html" class="nav-item">
                    📁 文件管理
                </a>
                <button class="nav-item logout">
                    🚪 退出登录
                </button>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="content-header">
                <h1>新闻管理</h1>
                <p>管理课题组的新闻动态和最新资讯</p>
            </div>

            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="搜索新闻标题..." id="search-input">
                        <div class="search-icon">🔍</div>
                    </div>
                    <select id="status-filter" class="form-select" style="width:auto; margin-left:1rem;">
                        <option value="">全部状态</option>
                        <option value="draft">草稿</option>
                        <option value="pending_review">待审核</option>
                        <option value="published">已发布</option>
                        <option value="scheduled">定时发布</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <select id="bulk-status" class="form-select" style="width:auto;">
                        <option value="">批量改状态</option>
                        <option value="draft">草稿</option>
                        <option value="pending_review">待审核</option>
                        <option value="published">已发布</option>
                        <option value="scheduled">定时发布</option>
                    </select>
                    <button class="btn btn-secondary" id="bulk-apply-btn" disabled>
                        应用(0)
                    </button>
                    <button class="btn btn-primary" id="add-news-btn">
                        ➕ 发布新闻
                    </button>
                </div>
            </div>

            <!-- 新闻列表 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="news-table">
                            <thead>
                                <tr>
                                    <th style="width: 42px;"><input type="checkbox" id="select-all-news"></th>
                                    <th>标题</th>
                                    <th>作者</th>
                                    <th>发布日期</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="news-tbody">
                                <tr>
                                    <td colspan="6" style="text-align: center; padding: 2rem;">
                                        <div class="spinner" style="margin: 0 auto 1rem;"></div>
                                        加载中...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="pagination-container"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 添加/编辑新闻模态框 -->
    <div id="news-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; overflow-y: auto;">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="background: white; border-radius: 8px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto;">
                <div class="card-header">
                    <h3 id="modal-title">发布新闻</h3>
                </div>
                <div class="card-body">
                    <form id="news-form">
                        <input type="hidden" id="news-id" name="id">
                        
                        <div class="form-group">
                            <label for="title" class="form-label">标题 *</label>
                            <input type="text" id="title" name="title" class="form-input" required>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label for="author" class="form-label">作者</label>
                                <input type="text" id="author" name="author" class="form-input" value="管理员">
                            </div>
                            
                            <div class="form-group">
                                <label for="publish_date" class="form-label">发布日期 *</label>
                                <input type="date" id="publish_date" name="publish_date" class="form-input" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="summary" class="form-label">摘要</label>
                            <textarea id="summary" name="summary" class="form-textarea" rows="3" placeholder="新闻简要描述，将显示在新闻列表中"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="content" class="form-label">正文内容 *</label>
                            <textarea id="content" name="content" class="form-textarea" rows="12" required placeholder="支持HTML格式"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="featured_image" class="form-label">特色图片</label>
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <input type="text" id="featured_image" name="featured_image" class="form-input" placeholder="图片URL或路径">
                                <button type="button" class="btn btn-secondary" id="upload-image-btn">
                                    📤 上传图片
                                </button>
                            </div>
                            <div style="margin-top: 0.5rem;">
                                <img id="image-preview" src="" alt="预览" style="max-width: 200px; max-height: 120px; display: none; border-radius: 4px; border: 1px solid #e2e8f0;">
                            </div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label for="category" class="form-label">分类</label>
                                <select id="category" name="category" class="form-select">
                                    <option value="general">一般新闻</option>
                                    <option value="research">研究成果</option>
                                    <option value="award">获奖信息</option>
                                    <option value="event">活动通知</option>
                                    <option value="personnel">人员变动</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="status" class="form-label">状态</label>
                                <select id="status" name="status" class="form-select">
                                    <option value="draft">草稿</option>
                                    <option value="pending_review">待审核</option>
                                    <option value="published">已发布</option>
                                    <option value="scheduled">定时发布</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" id="scheduled-publish-group" style="display:none;">
                            <label for="scheduled_publish_at" class="form-label">定时发布时间 *</label>
                            <input type="datetime-local" id="scheduled_publish_at" name="scheduled_publish_at" class="form-input">
                            <div style="color:#64748b; font-size:0.75rem; margin-top:0.35rem;">仅在状态为“定时发布”时生效</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="tags" class="form-label">标签</label>
                            <input type="text" id="tags" name="tags" class="form-input" placeholder="用逗号分隔多个标签">
                        </div>
                        
                        <div style="display: flex; gap: 1rem; justify-content: space-between; margin-top: 2rem;">
                            <div>
                                <button type="button" class="btn btn-secondary" id="preview-btn">
                                    👁️ 预览
                                </button>
                            </div>
                            <div style="display: flex; gap: 1rem;">
                                <button type="button" class="btn btn-secondary" id="cancel-btn">取消</button>
                                <button type="submit" class="btn btn-primary" id="save-btn">
                                    <span id="save-text">保存</span>
                                    <span id="save-loading" class="loading" style="display: none;">
                                        <span class="spinner"></span>
                                        保存中...
                                    </span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div id="preview-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1001; overflow-y: auto;">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="background: white; border-radius: 8px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto;">
                <div class="card-header">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>新闻预览</h3>
                        <button type="button" class="btn btn-small btn-secondary" id="close-preview-btn">
                            ✖️ 关闭
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="preview-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件上传 input -->
    <input type="file" id="file-input" accept="image/*" style="display: none;">

    
    <script src="js/admin.js"></script>
    <script>
        let currentPage = 1;
        let currentSearch = '';
        let currentStatus = '';
        const selectedNewsIds = new Set();
        const workflowStatuses = ['draft', 'pending_review', 'published', 'scheduled'];

        function toDatetimeLocalValue(value) {
            if (!value) return '';
            const dt = new Date(value);
            if (Number.isNaN(dt.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            const y = dt.getFullYear();
            const m = pad(dt.getMonth() + 1);
            const d = pad(dt.getDate());
            const hh = pad(dt.getHours());
            const mm = pad(dt.getMinutes());
            return `${y}-${m}-${d}T${hh}:${mm}`;
        }

        function updateScheduledFieldVisibility() {
            const statusValue = document.getElementById('status').value;
            const group = document.getElementById('scheduled-publish-group');
            if (statusValue === 'scheduled') {
                group.style.display = 'block';
            } else {
                group.style.display = 'none';
                document.getElementById('scheduled_publish_at').value = '';
            }
        }

        function applyInitialFiltersFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const status = String(params.get('status') || '').trim();
            const search = String(params.get('search') || '').trim();

            if (workflowStatuses.includes(status)) {
                currentStatus = status;
                document.getElementById('status-filter').value = status;
            }

            if (search) {
                currentSearch = search;
                document.getElementById('search-input').value = search;
            }
        }

        function resetNewsSelection() {
            selectedNewsIds.clear();
            syncNewsSelectionControls();
        }

        function syncNewsSelectionControls() {
            const applyBtn = document.getElementById('bulk-apply-btn');
            const status = document.getElementById('bulk-status').value;
            const count = selectedNewsIds.size;

            applyBtn.disabled = !(count > 0 && status);
            applyBtn.textContent = `应用(${count})`;

            const selectAll = document.getElementById('select-all-news');
            const rowCheckboxes = Array.from(document.querySelectorAll('.news-row-select'));
            const checkedCount = rowCheckboxes.filter((cb) => cb.checked).length;
            selectAll.checked = rowCheckboxes.length > 0 && checkedCount === rowCheckboxes.length;
            selectAll.indeterminate = checkedCount > 0 && checkedCount < rowCheckboxes.length;
        }

        async function applyBulkNewsStatus() {
            const status = document.getElementById('bulk-status').value;
            const ids = Array.from(selectedNewsIds);

            if (!status || !ids.length) {
                AdminUtils.showNotification('请先选择目标状态和记录', 'error');
                return;
            }

            let scheduledPublishAt = null;
            if (status === 'scheduled') {
                const input = prompt('请输入定时发布时间（格式：YYYY-MM-DDTHH:mm）');
                if (!input) {
                    return;
                }
                scheduledPublishAt = input.trim();
            }

            const confirmed = await AdminUtils.showConfirm(`确认将 ${ids.length} 条新闻更新为“${getStatusText(status)}”吗？`);
            if (!confirmed) return;

            try {
                const payload = {
                    ids,
                    status,
                    ...(scheduledPublishAt && { scheduled_publish_at: scheduledPublishAt })
                };
                const result = await AdminUtils.apiRequest('/news/batch', {
                    method: 'POST',
                    body: payload
                });

                AdminUtils.showNotification(result.message || '批量更新成功', 'success');
                document.getElementById('select-all-news').checked = false;
                resetNewsSelection();
                loadNews(currentPage, currentSearch, currentStatus);
            } catch (error) {
                console.error('批量更新新闻状态失败:', error);
                AdminUtils.showNotification('批量更新失败，请稍后重试', 'error');
            }
        }
        
        // 加载新闻列表
        async function loadNews(page = 1, search = '', status = '') {
            try {
                const params = new URLSearchParams({
                    page: page.toString(),
                    limit: '10',
                    ...(search && { search }),
                    ...(status && { status })
                });
                
                const response = await AdminUtils.apiRequest(`/news?${params}`);
                const news = response.news || response.data || [];
                const totalPages = response.totalPages ?? response.pagination?.totalPages ?? 1;
                const currentPageFromResponse = response.currentPage ?? response.pagination?.currentPage ?? page;
                const tbody = document.getElementById('news-tbody');
                
                if (news.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 2rem; color: #64748b;">
                                ${(search || status) ? '未找到匹配的新闻' : '暂无新闻数据'}
                            </td>
                        </tr>
                    `;
                    resetNewsSelection();
                    return;
                }
                
                tbody.innerHTML = news.map(newsItem => `
                    <tr>
                        <td><input type="checkbox" class="news-row-select" data-id="${newsItem.id}"></td>
                        <td>
                            <div style="font-weight: 500;">${newsItem.title}</div>
                            ${newsItem.summary ? `<div style="font-size: 0.75rem; color: #64748b; margin-top: 0.25rem;">${newsItem.summary.substring(0, 100)}${newsItem.summary.length > 100 ? '...' : ''}</div>` : ''}
                            
                        </td>
                        <td>${newsItem.author}</td>
                        <td>${AdminUtils.formatDate(newsItem.publish_date)}</td>
                        <td>
                            <span class="status-badge ${getStatusClass(newsItem.status)}">
                                ${getStatusText(newsItem.status)}
                            </span>
                        </td>
                        <td>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn btn-small btn-secondary" onclick="editNews(${newsItem.id})">
                                    编辑
                                </button>
                                <button class="btn btn-small btn-secondary" onclick="viewNews(${newsItem.id})">
                                    查看
                                </button>
                                <a class="btn btn-small btn-secondary" href="/news/detail.html?id=${newsItem.id}" target="_blank" rel="noopener noreferrer">
                                    前台
                                </a>
                                <button class="btn btn-small btn-secondary" onclick="copyFrontendNewsLink(${newsItem.id})">
                                    复制链接
                                </button>
                                <button class="btn btn-small btn-danger" onclick="deleteNews(${newsItem.id})">
                                    删除
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                resetNewsSelection();
                
                // 更新分页
                const paginationContainer = document.getElementById('pagination-container');
                if (totalPages > 1) {
                    const pagination = AdminUtils.createPagination(
                        currentPageFromResponse,
                        totalPages,
                        (page) => {
                            currentPage = page;
                            loadNews(page, currentSearch, currentStatus);
                        }
                    );
                    paginationContainer.innerHTML = '';
                    paginationContainer.appendChild(pagination);
                } else {
                    paginationContainer.innerHTML = '';
                }
                
            } catch (error) {
                console.error('加载新闻列表失败:', error);
                AdminUtils.showNotification('加载失败，请稍后重试', 'error');
            }
        }
        
        // 获取状态样式类
        function getStatusClass(status) {
            const statusMap = {
                published: 'status-success',
                draft: 'status-error',
                pending_review: 'status-warning',
                scheduled: 'status-warning'
            };
            return statusMap[status] || 'status-error';
        }
        
        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                published: '已发布',
                draft: '草稿',
                pending_review: '待审核',
                scheduled: '定时发布'
            };
            return statusMap[status] || status;
        }
        
        // 显示添加新闻模态框
        function showAddModal() {
            const modal = document.getElementById('news-modal');
            const form = document.getElementById('news-form');
            const title = document.getElementById('modal-title');
            
            title.textContent = '发布新闻';
            form.reset();
            document.getElementById('news-id').value = '';
            
            // 设置默认发布日期为今天
            document.getElementById('publish_date').value = new Date().toISOString().split('T')[0];
            document.getElementById('author').value = '管理员';
            document.getElementById('status').value = 'draft';
            updateScheduledFieldVisibility();
            
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        // 编辑新闻
        async function editNews(id) {
            try {
                const news = await AdminUtils.apiRequest(`/news/${id}`);
                
                const modal = document.getElementById('news-modal');
                const form = document.getElementById('news-form');
                const title = document.getElementById('modal-title');
                
                title.textContent = '编辑新闻';
                
                // 填充表单数据
                Object.keys(news).forEach(key => {
                    const element = form.querySelector(`[name="${key}"]`);
                    if (element) {
                        if (key === 'publish_date' && news[key]) {
                            element.value = new Date(news[key]).toISOString().split('T')[0];
                        } else if (key === 'scheduled_publish_at' && news[key]) {
                            element.value = toDatetimeLocalValue(news[key]);
                        } else {
                            element.value = news[key] || '';
                        }
                    }
                });

                updateScheduledFieldVisibility();
                
                // 更新图片预览
                updateImagePreview();
                
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
                
            } catch (error) {
                console.error('加载新闻数据失败:', error);
                AdminUtils.showNotification('加载失败，请稍后重试', 'error');
            }
        }
        
        // 查看新闻
        async function viewNews(id) {
            try {
                const news = await AdminUtils.apiRequest(`/news/${id}`);
                
                const previewContent = document.getElementById('preview-content');
                previewContent.innerHTML = `
                    <article style="max-width: none;">
                        <header style="margin-bottom: 2rem; text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem;">
                            <h1 style="margin: 0 0 1rem 0; color: #1e293b; font-size: 1.75rem;">${news.title}</h1>
                            <div style="color: #64748b; font-size: 0.875rem;">
                                <span>作者: ${news.author}</span>
                                <span style="margin: 0 1rem;">•</span>
                                <span>发布时间: ${AdminUtils.formatDate(news.publish_date)}</span>
                            </div>
                        </header>
                        ${news.featured_image ? `<img src="${news.featured_image}" alt="特色图片" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 1.5rem;">` : ''}
                        <div style="line-height: 1.8; color: #374151;">
                            ${news.content}
                        </div>
                        ${news.tags ? `
                            <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
                                <strong style="color: #64748b; font-size: 0.875rem;">标签: </strong>
                                ${news.tags.split(',').map(tag => `<span style="background: #f1f5f9; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-right: 0.5rem;">${tag.trim()}</span>`).join('')}
                            </div>
                        ` : ''}
                    </article>
                `;
                
                document.getElementById('preview-modal').style.display = 'block';
                
            } catch (error) {
                console.error('加载新闻失败:', error);
                AdminUtils.showNotification('加载失败，请稍后重试', 'error');
            }
        }
        
        // 删除新闻
        async function deleteNews(id) {
            const confirmed = await AdminUtils.showConfirm('确定要删除这条新闻吗？此操作不可撤销。');
            if (!confirmed) return;
            
            try {
                await AdminUtils.apiRequest(`/news/${id}`, {
                    method: 'DELETE'
                });
                
                AdminUtils.showNotification('新闻删除成功', 'success');
                loadNews(currentPage, currentSearch, currentStatus);
                
            } catch (error) {
                console.error('删除新闻失败:', error);
                AdminUtils.showNotification('删除失败，请稍后重试', 'error');
            }
        }

        // 复制新闻前台链接
        async function copyFrontendNewsLink(id) {
            const frontendUrl = `${window.location.origin}/news/detail.html?id=${id}`;
            try {
                await navigator.clipboard.writeText(frontendUrl);
                AdminUtils.showNotification('前台新闻链接已复制', 'success');
            } catch (error) {
                console.error('复制链接失败:', error);
                AdminUtils.showNotification('复制失败，请手动复制地址栏链接', 'error');
            }
        }
        
        // 隐藏模态框
        function hideModal() {
            const modal = document.getElementById('news-modal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
        
        // 隐藏预览模态框
        function hidePreviewModal() {
            const modal = document.getElementById('preview-modal');
            modal.style.display = 'none';
        }
        
        // 预览新闻
        function previewNews() {
            const form = document.getElementById('news-form');
            const formData = new FormData(form);
            
            const title = formData.get('title') || '无标题';
            const author = formData.get('author') || '未知作者';
            const publishDate = formData.get('publish_date') || new Date().toISOString().split('T')[0];
            const content = formData.get('content') || '暂无内容';
            const featuredImage = formData.get('featured_image');
            const tags = formData.get('tags');
            
            const previewContent = document.getElementById('preview-content');
            previewContent.innerHTML = `
                <article style="max-width: none;">
                    <header style="margin-bottom: 2rem; text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem;">
                        <h1 style="margin: 0 0 1rem 0; color: #1e293b; font-size: 1.75rem;">${title}</h1>
                        <div style="color: #64748b; font-size: 0.875rem;">
                            <span>作者: ${author}</span>
                            <span style="margin: 0 1rem;">•</span>
                            <span>发布时间: ${new Date(publishDate).toLocaleDateString('zh-CN')}</span>
                        </div>
                    </header>
                    ${featuredImage ? `<img src="${featuredImage}" alt="特色图片" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 1.5rem;">` : ''}
                    <div style="line-height: 1.8; color: #374151;">
                        ${content}
                    </div>
                    ${tags ? `
                        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
                            <strong style="color: #64748b; font-size: 0.875rem;">标签: </strong>
                            ${tags.split(',').map(tag => `<span style="background: #f1f5f9; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; margin-right: 0.5rem;">${tag.trim()}</span>`).join('')}
                        </div>
                    ` : ''}
                </article>
            `;
            
            document.getElementById('preview-modal').style.display = 'block';
        }
        
        // 更新图片预览
        function updateImagePreview() {
            const imageUrl = document.getElementById('featured_image').value;
            const preview = document.getElementById('image-preview');
            
            if (imageUrl) {
                preview.src = imageUrl;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }
        
        // 上传图片
        async function uploadImage() {
            const fileInput = document.getElementById('file-input');
            fileInput.click();
        }
        
        // 表单提交
        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const id = formData.get('id');
            const isEdit = !!id;
            
            // 表单验证
            const isValid = AdminUtils.validateForm(form, {
                title: { required: true, message: '请输入新闻标题' },
                content: { required: true, message: '请输入新闻内容' },
                publish_date: { required: true, message: '请选择发布日期' }
            });
            
            if (!isValid) return;
            
            const saveBtn = document.getElementById('save-btn');
            const saveText = document.getElementById('save-text');
            const saveLoading = document.getElementById('save-loading');

            if (formData.get('status') === 'scheduled' && !formData.get('scheduled_publish_at')) {
                AdminUtils.showNotification('请选择定时发布时间', 'error');
                return;
            }
            
            // 显示加载状态
            saveBtn.disabled = true;
            saveText.style.display = 'none';
            saveLoading.style.display = 'flex';
            
            try {
                const data = Object.fromEntries(formData);
                delete data.id; // 移除ID字段
                
                const url = isEdit ? `/news/${id}` : '/news';
                const method = isEdit ? 'PUT' : 'POST';
                
                const result = await AdminUtils.apiRequest(url, {
                    method,
                    body: data
                });
                
                AdminUtils.showNotification(
                    isEdit ? '新闻更新成功' : '新闻发布成功',
                    'success'
                );

                const frontendUrl = result?.frontend_url || (result?.id ? `/news/detail.html?id=${result.id}` : '');
                if (frontendUrl) {
                    const absoluteUrl = `${window.location.origin}${frontendUrl}`;
                    if (!isEdit) {
                        try {
                            await navigator.clipboard.writeText(absoluteUrl);
                            AdminUtils.showNotification('已复制前台链接，可直接分享', 'success');
                        } catch (_) {
                            // 忽略剪贴板失败，仍允许手动打开
                        }
                    }

                    if (confirm('是否立即在新标签页打开前台页面进行检查？')) {
                        window.open(frontendUrl, '_blank', 'noopener,noreferrer');
                    }
                }
                
                hideModal();
                loadNews(currentPage, currentSearch, currentStatus);
                
            } catch (error) {
                console.error('保存新闻失败:', error);
                AdminUtils.showNotification('保存失败，请稍后重试', 'error');
            } finally {
                // 恢复按钮状态
                saveBtn.disabled = false;
                saveText.style.display = 'block';
                saveLoading.style.display = 'none';
            }
        });
        
        // 事件监听
        document.getElementById('add-news-btn').addEventListener('click', showAddModal);
        document.getElementById('cancel-btn').addEventListener('click', hideModal);
        document.getElementById('preview-btn').addEventListener('click', previewNews);
        document.getElementById('close-preview-btn').addEventListener('click', hidePreviewModal);
        document.getElementById('upload-image-btn').addEventListener('click', uploadImage);
        document.getElementById('status').addEventListener('change', updateScheduledFieldVisibility);
        
        // 图片预览
        document.getElementById('featured_image').addEventListener('input', updateImagePreview);
        
        // 文件上传处理
        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            try {
                AdminUtils.showNotification('正在上传图片...', 'success');
                const result = await AdminUtils.uploadFile(file, 'news');
                
                document.getElementById('featured_image').value = result.url;
                updateImagePreview();
                AdminUtils.showNotification('图片上传成功', 'success');
                
            } catch (error) {
                console.error('图片上传失败:', error);
                AdminUtils.showNotification('图片上传失败，请稍后重试', 'error');
            }
        });
        
        // 搜索功能
        const searchInput = document.getElementById('search-input');
        const debouncedSearch = AdminUtils.debounce((search) => {
            currentSearch = search;
            currentPage = 1;
            loadNews(1, search, currentStatus);
        }, 300);
        
        searchInput.addEventListener('input', (e) => {
            debouncedSearch(e.target.value.trim());
        });

        document.getElementById('status-filter').addEventListener('change', (e) => {
            currentStatus = e.target.value;
            currentPage = 1;
            loadNews(1, currentSearch, currentStatus);
        });

        document.getElementById('select-all-news').addEventListener('change', (e) => {
            const checked = e.target.checked;
            document.querySelectorAll('.news-row-select').forEach((cb) => {
                cb.checked = checked;
                const id = Number.parseInt(cb.dataset.id, 10);
                if (!Number.isFinite(id)) return;
                if (checked) {
                    selectedNewsIds.add(id);
                } else {
                    selectedNewsIds.delete(id);
                }
            });
            syncNewsSelectionControls();
        });

        document.getElementById('news-tbody').addEventListener('change', (e) => {
            if (!e.target.classList.contains('news-row-select')) {
                return;
            }
            const id = Number.parseInt(e.target.dataset.id, 10);
            if (!Number.isFinite(id)) return;
            if (e.target.checked) {
                selectedNewsIds.add(id);
            } else {
                selectedNewsIds.delete(id);
            }
            syncNewsSelectionControls();
        });

        document.getElementById('bulk-status').addEventListener('change', () => {
            syncNewsSelectionControls();
        });

        document.getElementById('bulk-apply-btn').addEventListener('click', applyBulkNewsStatus);
        
        // 模态框点击外部关闭
        document.getElementById('news-modal').addEventListener('click', (e) => {
            if (e.target.id === 'news-modal') {
                hideModal();
            }
        });
        
        document.getElementById('preview-modal').addEventListener('click', (e) => {
            if (e.target.id === 'preview-modal') {
                hidePreviewModal();
            }
        });
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            applyInitialFiltersFromQuery();
            syncNewsSelectionControls();
            loadNews(1, currentSearch, currentStatus);
        });
        
        // 暴露函数到全局作用域（供行内 onclick 使用）
        window.editNews = editNews;
        window.viewNews = viewNews;
        window.deleteNews = deleteNews;
        window.copyFrontendNewsLink = copyFrontendNewsLink;
        
    </script>
</body>
</html>

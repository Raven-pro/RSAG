<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻管理 - RSAG</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .md-editor-shell {
            border: 1px solid #d0d7de;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .md-editor-tabs {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d0d7de;
            background: #f6f8fa;
            padding: 0.45rem 0.6rem;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .md-tab-group {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        .md-tab-btn {
            border: 1px solid transparent;
            background: transparent;
            color: #57606a;
            padding: 0.3rem 0.65rem;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .md-tab-btn.active {
            background: #ffffff;
            border-color: #d0d7de;
            color: #24292f;
            font-weight: 600;
        }

        .md-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            align-items: center;
        }

        .md-toolbar-btn {
            border: 1px solid #d0d7de;
            background: #ffffff;
            color: #24292f;
            font-size: 0.78rem;
            min-width: 28px;
            padding: 0.22rem 0.42rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .md-toolbar-btn:hover {
            background: #f3f4f6;
        }

        .md-editor-pane textarea {
            border: none;
            border-radius: 0;
            min-height: 260px;
            resize: vertical;
        }

        .md-preview-pane {
            min-height: 260px;
            padding: 1rem;
            display: none;
            overflow: auto;
            background: #ffffff;
            color: #24292f;
            line-height: 1.75;
        }

        .md-preview-pane img {
            max-width: 100%;
            border-radius: 0.5rem;
            margin: 0.8rem auto;
        }

        .md-preview-pane pre {
            background: #f6f8fa;
            border-radius: 6px;
            padding: 0.75rem;
            overflow: auto;
        }

        .md-preview-pane blockquote {
            margin: 0.75rem 0;
            padding-left: 0.85rem;
            border-left: 3px solid #d0d7de;
            color: #57606a;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>RSAG 管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item" data-role="admin">
                    📊 仪表板
                </a>
                <a href="publications.html" class="nav-item">
                    📚 论文管理
                </a>
                <a href="news.html" class="nav-item active">
                    📰 新闻管理
                </a>
                <a href="team.html" class="nav-item" data-role="admin">
                    👥 团队管理
                </a>
                <a href="files.html" class="nav-item" data-role="admin">
                    📁 文件管理
                </a>
                <a href="users.html" class="nav-item" data-role="admin">
                    🔐 账号管理
                </a>
                <button class="nav-item logout">
                    🚪 退出登录
                </button>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="content-header">
                <h1>新闻管理</h1>
                <p>管理课题组的新闻动态和最新资讯</p>
            </div>

            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <input type="text" class="search-input" placeholder="搜索新闻标题..." id="search-input">
                        <div class="search-icon">🔍</div>
                    </div>
                    <select id="status-filter" class="form-select" style="width:auto; margin-left:1rem;">
                        <option value="">全部状态</option>
                        <option value="draft">草稿</option>
                        <option value="pending_review">待审核</option>
                        <option value="published">已发布</option>
                        <option value="scheduled">定时发布</option>
                    </select>
                </div>
                <div class="toolbar-right">
                    <select id="bulk-status" class="form-select" style="width:auto;" data-role="admin">
                        <option value="">批量改状态</option>
                        <option value="draft">草稿</option>
                        <option value="pending_review">待审核</option>
                        <option value="published">已发布</option>
                        <option value="scheduled">定时发布</option>
                    </select>
                    <button class="btn btn-secondary" id="bulk-apply-btn" disabled data-role="admin">
                        应用(0)
                    </button>
                    <button class="btn btn-primary" id="add-news-btn">
                        ➕ 发布新闻
                    </button>
                </div>
            </div>

            <!-- 新闻列表 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-container">
                        <table class="table" id="news-table">
                            <thead>
                                <tr>
                                    <th style="width: 42px;" id="select-column-header" data-role="admin"><input type="checkbox" id="select-all-news"></th>
                                    <th>标题</th>
                                    <th>作者</th>
                                    <th>发布日期</th>
                                    <th style="width: 110px;">状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="news-tbody">
                                <tr>
                                    <td colspan="6" style="text-align: center; padding: 2rem;">
                                        <div class="spinner" style="margin: 0 auto 1rem;"></div>
                                        加载中...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="pagination-container"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 添加/编辑新闻模态框 -->
    <div id="news-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1000; overflow-y: auto;">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="background: white; border-radius: 8px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto;">
                <div class="card-header">
                    <h3 id="modal-title">发布新闻</h3>
                </div>
                <div class="card-body">
                    <form id="news-form">
                        <input type="hidden" id="news-id" name="id">
                        
                        <div class="form-group">
                            <label for="title" class="form-label">标题 *</label>
                            <input type="text" id="title" name="title" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label for="title_en" class="form-label">英文标题 *</label>
                            <input type="text" id="title_en" name="title_en" class="form-input" required>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label for="author" class="form-label">作者</label>
                                <input type="text" id="author" name="author" class="form-input" value="管理员">
                            </div>
                            
                            <div class="form-group">
                                <label for="publish_date" class="form-label">发布日期 *</label>
                                <input type="date" id="publish_date" name="publish_date" class="form-input" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="summary" class="form-label">摘要</label>
                            <textarea id="summary" name="summary" class="form-textarea" rows="3" placeholder="新闻简要描述，将显示在新闻列表中"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="summary_en" class="form-label">英文摘要</label>
                            <textarea id="summary_en" name="summary_en" class="form-textarea" rows="3" placeholder="English summary for bilingual site"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="content" class="form-label">正文内容（Markdown） *</label>
                            <div class="md-editor-shell" data-md-editor="zh">
                                <div class="md-editor-tabs">
                                    <div class="md-tab-group">
                                        <button type="button" class="md-tab-btn active" id="content-write-tab" onclick="setMarkdownMode('zh', 'write')">Write</button>
                                        <button type="button" class="md-tab-btn" id="content-preview-tab" onclick="setMarkdownMode('zh', 'preview')">Preview</button>
                                    </div>
                                    <div class="md-toolbar">
                                        <button type="button" class="md-toolbar-btn" title="标题" onclick="applyMarkdownAction('zh', 'heading')">H</button>
                                        <button type="button" class="md-toolbar-btn" title="加粗" onclick="applyMarkdownAction('zh', 'bold')"><strong>B</strong></button>
                                        <button type="button" class="md-toolbar-btn" title="斜体" onclick="applyMarkdownAction('zh', 'italic')"><em>I</em></button>
                                        <button type="button" class="md-toolbar-btn" title="引用" onclick="applyMarkdownAction('zh', 'quote')">"</button>
                                        <button type="button" class="md-toolbar-btn" title="列表" onclick="applyMarkdownAction('zh', 'ul')">•</button>
                                        <button type="button" class="md-toolbar-btn" title="链接" onclick="applyMarkdownAction('zh', 'link')">🔗</button>
                                        <button type="button" class="md-toolbar-btn" title="上传并插入图片" onclick="applyMarkdownAction('zh', 'image')">🖼</button>
                                        <button type="button" class="md-toolbar-btn" title="代码" onclick="applyMarkdownAction('zh', 'code')">&lt;/&gt;</button>
                                    </div>
                                </div>
                                <div class="md-editor-pane" id="content-write-pane">
                                    <textarea id="content" name="content" class="form-textarea" rows="12" required placeholder="支持标准 Markdown（GFM），可在任意位置插入 ![说明](图片URL)"></textarea>
                                </div>
                                <div id="content-preview" class="md-preview-pane prose max-w-none"></div>
                            </div>
                            <div style="margin-top:0.35rem; color:#64748b; font-size:0.75rem;">支持 Markdown 与行内图片语法，推荐使用工具栏的“🖼 上传并插入图片”。</div>
                        </div>

                        <div class="form-group">
                            <label for="content_en" class="form-label">英文正文（Markdown） *</label>
                            <div class="md-editor-shell" data-md-editor="en">
                                <div class="md-editor-tabs">
                                    <div class="md-tab-group">
                                        <button type="button" class="md-tab-btn active" id="content-en-write-tab" onclick="setMarkdownMode('en', 'write')">Write</button>
                                        <button type="button" class="md-tab-btn" id="content-en-preview-tab" onclick="setMarkdownMode('en', 'preview')">Preview</button>
                                    </div>
                                    <div class="md-toolbar">
                                        <button type="button" class="md-toolbar-btn" title="Heading" onclick="applyMarkdownAction('en', 'heading')">H</button>
                                        <button type="button" class="md-toolbar-btn" title="Bold" onclick="applyMarkdownAction('en', 'bold')"><strong>B</strong></button>
                                        <button type="button" class="md-toolbar-btn" title="Italic" onclick="applyMarkdownAction('en', 'italic')"><em>I</em></button>
                                        <button type="button" class="md-toolbar-btn" title="Quote" onclick="applyMarkdownAction('en', 'quote')">"</button>
                                        <button type="button" class="md-toolbar-btn" title="List" onclick="applyMarkdownAction('en', 'ul')">•</button>
                                        <button type="button" class="md-toolbar-btn" title="Link" onclick="applyMarkdownAction('en', 'link')">🔗</button>
                                        <button type="button" class="md-toolbar-btn" title="Upload and insert image" onclick="applyMarkdownAction('en', 'image')">🖼</button>
                                        <button type="button" class="md-toolbar-btn" title="Code" onclick="applyMarkdownAction('en', 'code')">&lt;/&gt;</button>
                                    </div>
                                </div>
                                <div class="md-editor-pane" id="content-en-write-pane">
                                    <textarea id="content_en" name="content_en" class="form-textarea" rows="12" required placeholder="Markdown (GFM) supported. Insert image anywhere using ![alt](image-url)"></textarea>
                                </div>
                                <div id="content-en-preview" class="md-preview-pane prose max-w-none"></div>
                            </div>
                            <div style="margin-top:0.35rem; color:#64748b; font-size:0.75rem;">Markdown preview follows GitHub-style rendering and supports inline images.</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="featured_image" class="form-label">特色图片</label>
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <input type="text" id="featured_image" name="featured_image" class="form-input" placeholder="图片URL或路径">
                                <button type="button" class="btn btn-secondary" id="upload-image-btn">
                                    📤 上传图片
                                </button>
                            </div>
                            <div style="margin-top:0.35rem; color:#64748b; font-size:0.75rem;">新闻图片建议不超过 2MB；超限时将自动压缩后上传。</div>
                            <div style="margin-top: 0.5rem;">
                                <img id="image-preview" src="" alt="预览" style="max-width: 200px; max-height: 120px; display: none; border-radius: 4px; border: 1px solid #e2e8f0;">
                            </div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label for="category" class="form-label">分类</label>
                                <select id="category" name="category" class="form-select">
                                    <option value="general">一般新闻</option>
                                    <option value="research">研究成果</option>
                                    <option value="award">获奖信息</option>
                                    <option value="event">活动通知</option>
                                    <option value="personnel">人员变动</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="status" class="form-label">状态</label>
                                <select id="status" name="status" class="form-select">
                                    <option value="draft">草稿</option>
                                    <option value="pending_review">待审核</option>
                                    <option value="published">已发布</option>
                                    <option value="scheduled">定时发布</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group" id="scheduled-publish-group" style="display:none;">
                            <label for="scheduled_publish_at" class="form-label">定时发布时间 *</label>
                            <input type="datetime-local" id="scheduled_publish_at" name="scheduled_publish_at" class="form-input">
                            <div style="color:#64748b; font-size:0.75rem; margin-top:0.35rem;">仅在状态为“定时发布”时生效</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="tags" class="form-label">标签</label>
                            <input type="text" id="tags" name="tags" class="form-input" placeholder="用逗号分隔多个标签">
                        </div>
                        
                        <div style="display: flex; gap: 1rem; justify-content: space-between; margin-top: 2rem;">
                            <div>
                                <button type="button" class="btn btn-secondary" id="preview-btn">
                                    👁️ 预览
                                </button>
                            </div>
                            <div style="display: flex; gap: 1rem;">
                                <button type="button" class="btn btn-secondary" id="cancel-btn">取消</button>
                                <button type="submit" class="btn btn-primary" id="save-btn">
                                    <span id="save-text">保存</span>
                                    <span id="save-loading" class="loading" style="display: none;">
                                        <span class="spinner"></span>
                                        保存中...
                                    </span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div id="preview-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); z-index: 1001; overflow-y: auto;">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="background: white; border-radius: 8px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto;">
                <div class="card-header">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>新闻预览</h3>
                        <button type="button" class="btn btn-small btn-secondary" id="close-preview-btn">
                            ✖️ 关闭
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="preview-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件上传 input -->
    <input type="file" id="file-input" accept="image/*" style="display: none;">
    <input type="file" id="md-image-input-zh" accept="image/*" style="display: none;">
    <input type="file" id="md-image-input-en" accept="image/*" style="display: none;">

    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        let currentPage = 1;
        let currentSearch = '';
        let currentStatus = '';
        let pendingUploadedImage = null;
        let pendingInlineUploads = [];
        const selectedNewsIds = new Set();
        const workflowStatuses = ['draft', 'pending_review', 'published', 'scheduled'];
        const currentUser = AdminUtils.getCurrentUser();
        const isAdmin = AdminUtils.isAdmin();
        const markdownEditors = {
            zh: {
                textareaId: 'content',
                previewId: 'content-preview',
                writePaneId: 'content-write-pane',
                writeTabId: 'content-write-tab',
                previewTabId: 'content-preview-tab',
                imageInputId: 'md-image-input-zh'
            },
            en: {
                textareaId: 'content_en',
                previewId: 'content-en-preview',
                writePaneId: 'content-en-write-pane',
                writeTabId: 'content-en-write-tab',
                previewTabId: 'content-en-preview-tab',
                imageInputId: 'md-image-input-en'
            }
        };

        async function deleteUploadedFileById(fileId) {
            const id = Number.parseInt(fileId, 10);
            if (!Number.isInteger(id) || id <= 0) return;
            try {
                await AdminUtils.apiRequest(`/files/${id}`, { method: 'DELETE' });
            } catch (error) {
                console.warn('清理临时上传文件失败:', error);
            }
        }

        function setPendingUploadedImage(fileMeta) {
            const id = Number.parseInt(fileMeta?.id, 10);
            const url = String(fileMeta?.url || '').trim();
            if (!Number.isInteger(id) || !url) {
                return;
            }
            if (pendingUploadedImage && pendingUploadedImage.id !== id) {
                void deleteUploadedFileById(pendingUploadedImage.id);
            }
            pendingUploadedImage = { id, url };
        }

        function clearPendingUploadedImage() {
            pendingUploadedImage = null;
        }

        function cleanupPendingUploadedImage() {
            if (!pendingUploadedImage) return;
            const stale = pendingUploadedImage;
            pendingUploadedImage = null;
            void deleteUploadedFileById(stale.id);
        }

        function setPendingInlineUpload(fileMeta) {
            const id = Number.parseInt(fileMeta?.id, 10);
            const url = String(fileMeta?.url || '').trim();
            if (!Number.isInteger(id) || id <= 0 || !url) {
                return;
            }
            if (!pendingInlineUploads.some((item) => item.id === id)) {
                pendingInlineUploads.push({ id, url });
            }
        }

        function clearPendingInlineUploads() {
            pendingInlineUploads = [];
        }

        function cleanupPendingInlineUploads() {
            if (!pendingInlineUploads.length) return;
            const staleList = pendingInlineUploads;
            pendingInlineUploads = [];
            staleList.forEach((item) => {
                void deleteUploadedFileById(item.id);
            });
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderMarkdownToHtml(markdownText) {
            const source = String(markdownText || '').trim();
            if (!source) {
                return '';
            }

            try {
                if (window.marked) {
                    marked.setOptions({ gfm: true, breaks: true });
                    const rawHtml = marked.parse(source);
                    if (window.DOMPurify) {
                        return DOMPurify.sanitize(rawHtml, { USE_PROFILES: { html: true } });
                    }
                    return rawHtml;
                }
            } catch (error) {
                console.warn('Markdown 渲染失败，回退为纯文本:', error);
            }

            return `<p>${escapeHtml(source).replace(/\n/g, '<br>')}</p>`;
        }

        function getEditorConfig(lang) {
            return markdownEditors[lang] || null;
        }

        function getEditorTextarea(lang) {
            const config = getEditorConfig(lang);
            if (!config) return null;
            return document.getElementById(config.textareaId);
        }

        function updateMarkdownPreview(lang) {
            const config = getEditorConfig(lang);
            if (!config) return;

            const textarea = document.getElementById(config.textareaId);
            const preview = document.getElementById(config.previewId);
            if (!textarea || !preview) return;

            const html = renderMarkdownToHtml(textarea.value);
            preview.innerHTML = html || '<p style="color:#64748b;">暂无内容</p>';
        }

        function setMarkdownMode(lang, mode = 'write') {
            const config = getEditorConfig(lang);
            if (!config) return;

            const writePane = document.getElementById(config.writePaneId);
            const previewPane = document.getElementById(config.previewId);
            const writeTab = document.getElementById(config.writeTabId);
            const previewTab = document.getElementById(config.previewTabId);

            const isPreview = mode === 'preview';
            if (writePane) writePane.style.display = isPreview ? 'none' : 'block';
            if (previewPane) previewPane.style.display = isPreview ? 'block' : 'none';

            if (writeTab) writeTab.classList.toggle('active', !isPreview);
            if (previewTab) previewTab.classList.toggle('active', isPreview);

            if (isPreview) {
                updateMarkdownPreview(lang);
            }
        }

        function insertTextAtCursor(textarea, text, fallbackText = '') {
            if (!textarea) return;

            const start = textarea.selectionStart ?? textarea.value.length;
            const end = textarea.selectionEnd ?? start;
            const selected = textarea.value.substring(start, end);
            const finalText = text.includes('$SELECTION$')
                ? text.replace('$SELECTION$', selected || fallbackText)
                : text;

            textarea.setRangeText(finalText, start, end, 'end');
            textarea.focus();
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function applyMarkdownAction(lang, action) {
            const config = getEditorConfig(lang);
            const textarea = getEditorTextarea(lang);
            if (!config || !textarea) return;

            switch (action) {
                case 'heading':
                    insertTextAtCursor(textarea, '## $SELECTION$', '小标题');
                    break;
                case 'bold':
                    insertTextAtCursor(textarea, '**$SELECTION$**', '加粗文本');
                    break;
                case 'italic':
                    insertTextAtCursor(textarea, '*$SELECTION$*', '斜体文本');
                    break;
                case 'quote':
                    insertTextAtCursor(textarea, '> $SELECTION$', '引用内容');
                    break;
                case 'ul':
                    insertTextAtCursor(textarea, '- $SELECTION$', '列表项');
                    break;
                case 'code':
                    insertTextAtCursor(textarea, '\n```\n$SELECTION$\n```\n', '代码片段');
                    break;
                case 'link': {
                    const url = prompt('请输入链接地址', 'https://');
                    if (!url) return;
                    insertTextAtCursor(textarea, `[$SELECTION$](${url.trim()})`, '链接文本');
                    break;

                case 'image': {
                    const imageInput = document.getElementById(config.imageInputId);
                    if (imageInput) imageInput.click();
                    break;
                }
                default:
                    break;
            }
        }

        function extractImageUrlsFromContent(...contents) {
            const merged = contents.map((item) => String(item || '')).join('\n');
            const urls = new Set();

            const markdownPattern = /!\[[^\]]*\]\(([^)\n]+)\)/g;
            let mdMatch;
            while ((mdMatch = markdownPattern.exec(merged)) !== null) {
                const raw = String(mdMatch[1] || '').trim();
                if (!raw) continue;
                const normalized = raw.replace(/^<|>$/g, '').split(/\s+/)[0].trim();
                if (normalized) {
                    urls.add(normalized);
                }
            }

            const htmlPattern = /<img[^>]+src=["']([^"']+)["'][^>]*>/gi;
            let htmlMatch;
            while ((htmlMatch = htmlPattern.exec(merged)) !== null) {
                const normalized = String(htmlMatch[1] || '').trim();
                if (normalized) {
                    urls.add(normalized);
                }
            }

            return urls;
        }

        async function pruneUnusedPendingInlineUploads({ content, content_en, featured_image }) {
            if (!pendingInlineUploads.length) return;

            const usedUrls = extractImageUrlsFromContent(content, content_en);
            const featured = String(featured_image || '').trim();
            if (featured) {
                usedUrls.add(featured);
            }

            const remained = [];
            for (const item of pendingInlineUploads) {
                if (usedUrls.has(item.url)) {
                    remained.push(item);
                } else {
                    await deleteUploadedFileById(item.id);
                }
            }
            pendingInlineUploads = remained;
        }

        function toDatetimeLocalValue(value) {
            if (!value) return '';
            const dt = new Date(value);
            if (Number.isNaN(dt.getTime())) return '';
            const pad = (n) => String(n).padStart(2, '0');
            const y = dt.getFullYear();
            const m = pad(dt.getMonth() + 1);
            const d = pad(dt.getDate());
            const hh = pad(dt.getHours());
            const mm = pad(dt.getMinutes());
            return `${y}-${m}-${d}T${hh}:${mm}`;
        }

                publish_date: { required: true, message: '请选择发布日期' }
            });
            
            if (!isValid) return;
            
            const saveBtn = document.getElementById('save-btn');
            const saveText = document.getElementById('save-text');
            const saveLoading = document.getElementById('save-loading');

            if (isAdmin && formData.get('status') === 'scheduled' && !formData.get('scheduled_publish_at')) {
                AdminUtils.showNotification('请选择定时发布时间', 'error');
                return;
            }

            if (!isAdmin) {
                formData.set('status', 'pending_review');
                formData.set('author', currentUser?.username || '');
            }
            
            // 显示加载状态
            saveBtn.disabled = true;
            saveText.style.display = 'none';
            saveLoading.style.display = 'flex';
            
            try {
                const data = Object.fromEntries(formData);
                delete data.id; // 移除ID字段
                let keepPendingUploadedImage = false;

                if (pendingUploadedImage) {
                    const selectedImageUrl = String(data.featured_image || '').trim();
                    if (selectedImageUrl === pendingUploadedImage.url) {
                        keepPendingUploadedImage = true;
                    } else {
                        cleanupPendingUploadedImage();
                    }
                }

                await pruneUnusedPendingInlineUploads(data);
                
                const url = isEdit ? `/news/${id}` : '/news';
                const method = isEdit ? 'PUT' : 'POST';
                
                const result = await AdminUtils.apiRequest(url, {
                    method,
                    body: data
                });

                const successMessage = isEdit
                    ? (isAdmin ? '新闻更新成功' : '新闻已更新并提交审核')
                    : (isAdmin ? '新闻发布成功' : '新闻已提交审核');

                const frontendUrl = result?.frontend_url || (result?.id ? `/news/detail.html?id=${result.id}` : '');

                if (keepPendingUploadedImage) {
                    clearPendingUploadedImage();
                }

                clearPendingInlineUploads();

                hideModal();
                await loadNews(currentPage, currentSearch, currentStatus);
                AdminUtils.showNotification(successMessage, 'success');

                if (frontendUrl) {
                    const absoluteUrl = `${window.location.origin}${frontendUrl}`;
                    if (!isEdit) {
                        try {
                            await navigator.clipboard.writeText(absoluteUrl);
                            AdminUtils.showNotification('已复制前台链接，可直接分享', 'success');
                        } catch (_) {
                            // 忽略剪贴板失败，仍允许手动打开
                        }
                        if (confirm('是否立即在新标签页打开前台页面进行检查？')) {
                            window.open(frontendUrl, '_blank', 'noopener,noreferrer');
                        }
                    }
                }
                
            } catch (error) {
                console.error('保存新闻失败:', error);
                AdminUtils.showNotification('保存失败，请稍后重试', 'error');
            } finally {
                // 恢复按钮状态
                saveBtn.disabled = false;
                saveText.style.display = 'block';
                saveLoading.style.display = 'none';
            }
        });
        
        // 事件监听
        document.getElementById('add-news-btn').addEventListener('click', showAddModal);
        document.getElementById('cancel-btn').addEventListener('click', hideModal);
        document.getElementById('preview-btn').addEventListener('click', previewNews);
        document.getElementById('close-preview-btn').addEventListener('click', hidePreviewModal);
        document.getElementById('upload-image-btn').addEventListener('click', uploadImage);
        document.getElementById('status').addEventListener('change', updateScheduledFieldVisibility);
        document.getElementById('content').addEventListener('input', () => updateMarkdownPreview('zh'));
        document.getElementById('content_en').addEventListener('input', () => updateMarkdownPreview('en'));
        
        // 图片预览
        document.getElementById('featured_image').addEventListener('input', updateImagePreview);
        
        // 文件上传处理
        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            try {
                AdminUtils.showNotification('正在上传图片...', 'success');
                const result = await AdminUtils.uploadFile(file, 'news');
                setPendingUploadedImage({
                    id: result?.file?.id,
                    url: result?.url
                });
                
                document.getElementById('featured_image').value = result.url;
                updateImagePreview();
                AdminUtils.showNotification('图片上传成功', 'success');
                
            } catch (error) {
                console.error('图片上传失败:', error);
                AdminUtils.showNotification('图片上传失败，请稍后重试', 'error');
            }
        });

        document.getElementById('md-image-input-zh').addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            e.target.value = '';
            if (!file) return;
            await uploadMarkdownImageAtCursor('zh', file);
        });

        document.getElementById('md-image-input-en').addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            e.target.value = '';
            if (!file) return;
            await uploadMarkdownImageAtCursor('en', file);
        });
        
        // 搜索功能
        const searchInput = document.getElementById('search-input');
        const debouncedSearch = AdminUtils.debounce((search) => {
            currentSearch = search;
            currentPage = 1;
            loadNews(1, search, currentStatus);
        }, 300);
        
        searchInput.addEventListener('input', (e) => {
            debouncedSearch(e.target.value.trim());
        });

        document.getElementById('status-filter').addEventListener('change', (e) => {
            currentStatus = e.target.value;
            currentPage = 1;
            loadNews(1, currentSearch, currentStatus);
        });

        document.getElementById('select-all-news').addEventListener('change', (e) => {
            const checked = e.target.checked;
            document.querySelectorAll('.news-row-select').forEach((cb) => {
                cb.checked = checked;
                const id = Number.parseInt(cb.dataset.id, 10);
                if (!Number.isFinite(id)) return;
                if (checked) {
                    selectedNewsIds.add(id);
                } else {
                    selectedNewsIds.delete(id);
                }
            });
            syncNewsSelectionControls();
        });

        document.getElementById('news-tbody').addEventListener('change', (e) => {
            if (!e.target.classList.contains('news-row-select')) {
                return;
            }
            const id = Number.parseInt(e.target.dataset.id, 10);
            if (!Number.isFinite(id)) return;
            if (e.target.checked) {
                selectedNewsIds.add(id);
            } else {
                selectedNewsIds.delete(id);
            }
            syncNewsSelectionControls();
        });

        document.getElementById('bulk-status').addEventListener('change', () => {
            syncNewsSelectionControls();
        });

        document.getElementById('bulk-apply-btn').addEventListener('click', applyBulkNewsStatus);
        
        // 模态框点击外部关闭
        document.getElementById('news-modal').addEventListener('click', (e) => {
            if (e.target.id === 'news-modal') {
                hideModal();
            }
        });
        
        document.getElementById('preview-modal').addEventListener('click', (e) => {
            if (e.target.id === 'preview-modal') {
                hidePreviewModal();
            }
        });
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', () => {
            applyRoleControls();
            applyInitialFiltersFromQuery();
            syncNewsSelectionControls();
            setMarkdownMode('zh', 'write');
            setMarkdownMode('en', 'write');
            applyQuickBindFromQuery();
            loadNews(1, currentSearch, currentStatus);
        });
        
        // 暴露函数到全局作用域（供行内 onclick 使用）
        window.editNews = editNews;
        window.viewNews = viewNews;
        window.deleteNews = deleteNews;
        window.copyFrontendNewsLink = copyFrontendNewsLink;
        window.setMarkdownMode = setMarkdownMode;
        window.applyMarkdownAction = applyMarkdownAction;
        
    </script>
</body>
</html>

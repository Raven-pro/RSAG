<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理仪表板 - RSAG</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>RSAG 管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item active" data-role="admin">
                    📊 仪表板
                </a>
                <a href="publications.html" class="nav-item" data-role="admin">
                    📚 论文管理
                </a>
                <a href="news.html" class="nav-item">
                    📰 新闻管理
                </a>
                <a href="team.html" class="nav-item" data-role="admin">
                    👥 团队管理
                </a>
                <a href="files.html" class="nav-item" data-role="admin">
                    📁 文件管理
                </a>
                <a href="users.html" class="nav-item" data-role="admin">
                    🔐 账号管理
                </a>
                <button class="nav-item logout">
                    🚪 退出登录
                </button>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <div class="content-header">
                <h1>管理仪表板</h1>
                <p>欢迎回到RSAG课题组管理系统</p>
            </div>

            <!-- 统计卡片 -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
                <div class="card">
                    <div class="card-body" style="text-align: center;">
                        <div style="font-size: 2rem; font-weight: bold; color: var(--tsinghua-purple); margin-bottom: 0.5rem;" id="publications-count">
                            -
                        </div>
                        <div style="color: #64748b;">发表论文</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body" style="text-align: center;">
                        <div style="font-size: 2rem; font-weight: bold; color: var(--success-green); margin-bottom: 0.5rem;" id="news-count">
                            -
                        </div>
                        <div style="color: #64748b;">新闻动态</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body" style="text-align: center;">
                        <div style="font-size: 2rem; font-weight: bold; color: var(--warning-yellow); margin-bottom: 0.5rem;" id="team-count">
                            -
                        </div>
                        <div style="color: #64748b;">团队成员</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-body" style="text-align: center;">
                        <div style="font-size: 2rem; font-weight: bold; color: var(--error-red); margin-bottom: 0.5rem;" id="files-count">
                            -
                        </div>
                        <div style="color: #64748b;">管理文件</div>
                    </div>
                </div>
            </div>

            <!-- 快速操作 -->
            <div class="card">
                <div class="card-header">
                    <h3>快速操作</h3>
                </div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                        <a href="publications.html?action=add" class="btn btn-primary">
                            ➕ 添加新论文
                        </a>
                        <a href="news.html?action=add" class="btn btn-success">
                            📝 发布新闻
                        </a>
                        <a href="team.html?action=add" class="btn btn-secondary">
                            👤 添加成员
                        </a>
                        <a href="files.html?action=upload" class="btn btn-secondary">
                            📤 上传文件
                        </a>
                    </div>
                </div>
            </div>

            <!-- 趋势分析 -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
                    <h3 style="margin: 0;">运营趋势</h3>
                    <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                        <label for="trend-granularity" style="font-size:0.85rem; color:#475569;">粒度</label>
                        <select id="trend-granularity" class="form-select" style="width: 110px;">
                            <option value="day" selected>按天</option>
                            <option value="week">按周</option>
                        </select>
                        <label for="range-days" style="font-size:0.85rem; color:#475569;">周期</label>
                        <select id="range-days" class="form-select" style="width: 130px;">
                            <option value="7">近7天</option>
                            <option value="30" selected>近30天</option>
                            <option value="90">近90天</option>
                            <option value="180">近180天</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div id="trend-summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1rem;"></div>
                    <div id="trend-insights" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:0.7rem; margin-bottom:0.85rem;"></div>
                    <div id="trend-rows" style="display: flex; flex-direction: column; gap: 0.5rem;" aria-live="polite"></div>
                </div>
            </div>

            <!-- 类型分布 -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-header">
                    <h3>论文类型分布</h3>
                </div>
                <div class="card-body">
                    <div id="publication-type-chart" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
                </div>
            </div>

            <!-- 工作流看板 -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-header">
                    <h3>内容工作流看板</h3>
                </div>
                <div class="card-body">
                    <div id="workflow-summary" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.9rem; margin-bottom: 1rem;"></div>
                    <div id="workflow-board" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem;"></div>
                </div>
            </div>

            <!-- 最近活动 -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-header">
                    <h3>最近活动</h3>
                </div>
                <div class="card-body">
                    <div id="recent-activities">
                        <div style="text-align: center; color: #64748b; padding: 2rem;">
                            <div class="spinner" style="margin: 0 auto 1rem;"></div>
                            加载中...
                        </div>
                    </div>
                </div>
            </div>

            <!-- 系统状态 -->
            <div class="card" style="margin-top: 2rem;">
                <div class="card-header">
                    <h3>系统状态</h3>
                </div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                        <div>
                            <div style="font-weight: 500; margin-bottom: 0.5rem;">数据库连接</div>
                            <div class="status-badge status-success" id="db-status">
                                正常
                            </div>
                        </div>
                        <div>
                            <div style="font-weight: 500; margin-bottom: 0.5rem;">文件存储</div>
                            <div class="status-badge status-success" id="storage-status">
                                正常
                            </div>
                        </div>
                        <div>
                            <div style="font-weight: 500; margin-bottom: 0.5rem;">最后更新</div>
                            <div style="color: #64748b; font-size: 0.875rem;" id="last-update">
                                -
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script>
        let rangeDays = 30;
        let granularity = 'day';
        const hiddenTrendSeries = new Set();

        // 获取 token
        function getToken() {
            try { return AdminUtils.getToken(); } catch { return window.parent?.localStorage?.getItem('adminToken'); }
        }

        function renderTrendSummary(stats) {
            const container = document.getElementById('trend-summary');
            const trendData = stats?.trends || {};
            const sum = (list = []) => list.reduce((acc, cur) => acc + (Number(cur) || 0), 0);

            const cards = [
                { label: '新增论文', value: sum(trendData.publications), color: 'var(--tsinghua-purple)' },
                { label: '新增新闻', value: sum(trendData.news), color: 'var(--success-green)' },
                { label: '新增文件', value: sum(trendData.files), color: 'var(--warning-yellow)' }
            ];

            container.innerHTML = cards.map(card => `
                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0.9rem;">
                    <div style="font-size: 0.85rem; color: #64748b;">${card.label}</div>
                    <div style="font-size: 1.5rem; font-weight: 700; color: ${card.color}; margin-top: 0.25rem;">${card.value}</div>
                </div>
            `).join('');
        }

        function renderTrendInsights(stats) {
            const container = document.getElementById('trend-insights');
            if (!container) return;

            const trends = stats?.trends || {};
            const dates = Array.isArray(trends.dates) ? trends.dates : [];
            if (!dates.length) {
                container.innerHTML = '';
                return;
            }

            const mode = trends.granularity || stats?.granularity || granularity;
            const sum = (list = []) => list.reduce((acc, cur) => acc + (Number(cur) || 0), 0);
            const series = [
                {
                    key: 'publications',
                    label: '论文',
                    color: '#5b21b6',
                    total: sum(trends.publications || []),
                    peak: trends?.peaks?.publications || {}
                },
                {
                    key: 'news',
                    label: '新闻',
                    color: '#10b981',
                    total: sum(trends.news || []),
                    peak: trends?.peaks?.news || {}
                },
                {
                    key: 'files',
                    label: '文件',
                    color: '#f59e0b',
                    total: sum(trends.files || []),
                    peak: trends?.peaks?.files || {}
                }
            ];

            const leader = series.slice().sort((a, b) => b.total - a.total)[0];
            const peakCards = series.map((item) => {
                const peakValue = Number(item?.peak?.value) || 0;
                const peakDate = item?.peak?.date ? formatBucketLabel(item.peak.date, mode) : '-';
                return `
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:0.68rem 0.78rem;">
                        <div style="font-size:0.8rem; color:#64748b;">${item.label}峰值</div>
                        <div style="font-size:1.05rem; font-weight:700; color:${item.color}; margin-top:0.18rem;">${peakValue}</div>
                        <div style="font-size:0.76rem; color:#64748b; margin-top:0.14rem;">发生于 ${peakDate}</div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                ${peakCards}
                <div style="grid-column:1 / -1; border:1px dashed #cbd5e1; border-radius:10px; padding:0.6rem 0.78rem; background:#ffffff; color:#475569; font-size:0.8rem;">
                    当前${mode === 'week' ? '周' : '日'}粒度下，活跃度最高为 <strong style="color:#0f172a;">${leader.label}</strong>（总新增 ${leader.total}）；柱和线均表示新增量。
                </div>
            `;
        }

        function formatBucketLabel(date, mode = 'day') {
            const text = String(date || '');
            if (!text) return '-';
            return mode === 'week' ? `${text.slice(5)} 周` : text.slice(5);
        }

        function computeMovingAverage(values, windowSize) {
            const list = Array.isArray(values) ? values : [];
            const window = Math.max(1, Number.parseInt(windowSize, 10) || 1);
            const result = [];
            for (let i = 0; i < list.length; i += 1) {
                const start = Math.max(0, i - window + 1);
                const segment = list.slice(start, i + 1);
                const total = segment.reduce((acc, cur) => acc + (Number(cur) || 0), 0);
                result.push(Number((total / segment.length).toFixed(2)));
            }
            return result;
        }

        function resolveMovingSeries(trends, key, values, mode) {
            const map = {
                publications: 'publicationsMovingAvg',
                news: 'newsMovingAvg',
                files: 'filesMovingAvg'
            };
            const field = map[key];
            const fromApi = Array.isArray(trends?.[field]) ? trends[field] : [];
            if (fromApi.length === values.length) {
                return fromApi.map(item => Number(item) || 0);
            }
            const fallbackWindow = mode === 'week' ? 4 : 7;
            return computeMovingAverage(values, fallbackWindow);
        }

        function resolvePeak(trends, key, values, dates) {
            const fromApi = trends?.peaks?.[key];
            const index = Number.parseInt(fromApi?.index, 10);
            if (Number.isInteger(index) && index >= 0 && index < values.length) {
                return {
                    index,
                    value: Number(values[index]) || 0,
                    date: dates[index] || null
                };
            }

            let peakIndex = 0;
            let peakValue = 0;
            for (let i = 0; i < values.length; i += 1) {
                const value = Number(values[i]) || 0;
                if (value > peakValue) {
                    peakValue = value;
                    peakIndex = i;
                }
            }

            return {
                index: peakIndex,
                value: peakValue,
                date: dates[peakIndex] || null
            };
        }

        function buildSeriesPoints(values, xPositions, topPad, innerHeight, maxValue) {
            if (!values.length) return [];
            return values.map((value, index) => {
                const x = Number(xPositions?.[index]);
                const y = topPad + innerHeight - ((Number(value) || 0) / maxValue) * innerHeight;
                return { x: Number.isFinite(x) ? x : 0, y, value: Number(value) || 0, index };
            });
        }

        function buildLinePath(points) {
            if (!points.length) return '';
            if (points.length === 1) {
                return `M ${points[0].x},${points[0].y} L ${points[0].x},${points[0].y}`;
            }
            return `M ${points.map((point) => `${point.x},${point.y}`).join(' L ')}`;
        }

        function buildPointDots(points, color, strokeColor, dates, label, mode) {
            return points.map((point) => `
                <circle cx="${point.x}" cy="${point.y}" r="2.8" fill="${color}" stroke="${strokeColor}" stroke-width="1.2">
                    <title>${formatBucketLabel(dates[point.index], mode)} ${label}新增：${point.value}</title>
                </circle>
            `).join('');
        }

        function renderTrendRows(stats) {
            const container = document.getElementById('trend-rows');
            const trends = stats?.trends || {};
            const mode = trends.granularity || stats?.granularity || granularity;
            const dates = trends.dates || [];
            const publications = trends.publications || [];
            const news = trends.news || [];
            const files = trends.files || [];

            if (!dates.length) {
                container.innerHTML = '<div style="color:#64748b; text-align:center; padding:1rem;">暂无趋势数据</div>';
                return;
            }

            const series = [
                {
                    key: 'publications',
                    label: '论文',
                    values: publications,
                    movingAvg: resolveMovingSeries(trends, 'publications', publications, mode),
                    peak: resolvePeak(trends, 'publications', publications, dates),
                    barColor: '#ddd6fe',
                    lineColor: '#5b21b6',
                    dotStroke: '#ede9fe'
                },
                {
                    key: 'news',
                    label: '新闻',
                    values: news,
                    movingAvg: resolveMovingSeries(trends, 'news', news, mode),
                    peak: resolvePeak(trends, 'news', news, dates),
                    barColor: '#a7f3d0',
                    lineColor: '#10b981',
                    dotStroke: '#d1fae5'
                },
                {
                    key: 'files',
                    label: '文件',
                    values: files,
                    movingAvg: resolveMovingSeries(trends, 'files', files, mode),
                    peak: resolvePeak(trends, 'files', files, dates),
                    barColor: '#fde68a',
                    lineColor: '#f59e0b',
                    dotStroke: '#fef3c7'
                }
            ];

            const visibleSeries = series.filter(item => !hiddenTrendSeries.has(item.key));
            const allValues = visibleSeries.flatMap(item => [...item.values, ...item.movingAvg]);
            const maxValue = Math.max(1, ...allValues);

            const width = 920;
            const height = 320;
            const leftPad = 48;
            const rightPad = 24;
            const topPad = 16;
            const labelStep = dates.length > 120 ? 21 : dates.length > 90 ? 14 : dates.length > 60 ? 10 : dates.length > 30 ? 5 : dates.length > 14 ? 2 : 1;
            const shouldRotate = mode === 'day' && dates.length > 14 && dates.length <= 45;
            const rotation = shouldRotate ? -32 : 0;
            const labelFontSize = dates.length > 90 ? 9 : dates.length > 45 ? 9.5 : dates.length > 20 ? 10 : 11;
            const bottomPad = shouldRotate ? 46 : 28;

            const plotWidth = width - leftPad - rightPad;
            const slotWidth = dates.length > 1 ? plotWidth / (dates.length - 1) : plotWidth;
            const groupWidth = Math.min(42, Math.max(14, slotWidth * 0.72));
            const xStart = leftPad + groupWidth / 2;
            const xEnd = width - rightPad - groupWidth / 2;
            const innerWidth = Math.max(1, xEnd - xStart);
            const innerHeight = height - topPad - bottomPad;
            const xPositions = dates.map((_, index) => (
                dates.length === 1 ? (xStart + xEnd) / 2 : xStart + (index * innerWidth) / (dates.length - 1)
            ));
            const activeCount = Math.max(1, visibleSeries.length);
            const barGap = 2;
            const barWidth = Math.max(4, (groupWidth - barGap * (activeCount - 1)) / activeCount);
            const fullGroupWidth = activeCount * barWidth + (activeCount - 1) * barGap;
            const offsetStart = -fullGroupWidth / 2 + barWidth / 2;
            const seriesOffsets = new Map();
            visibleSeries.forEach((item, index) => {
                seriesOffsets.set(item.key, offsetStart + index * (barWidth + barGap));
            });
            const yStep = Math.max(1, Math.ceil(maxValue / 4));
            const axisMax = yStep * 4;

            const yGrid = [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
                const y = topPad + innerHeight * ratio;
                const labelValue = Math.round(axisMax * (1 - ratio));
                return `
                    <line x1="${leftPad}" y1="${y}" x2="${width - rightPad}" y2="${y}" stroke="#e2e8f0" stroke-dasharray="3 3" />
                    <text x="${leftPad - 8}" y="${y + 4}" font-size="11" fill="#94a3b8" text-anchor="end">${labelValue}</text>
                `;
            }).join('');

            const xGrid = dates.map((_, index) => {
                const x = xPositions[index];
                return `<line x1="${x}" y1="${topPad}" x2="${x}" y2="${topPad + innerHeight}" stroke="#f1f5f9" />`;
            }).join('');

            const barsMarkup = dates.map((_, index) => {
                const centerX = xPositions[index];
                return visibleSeries.map((item, seriesIndex) => {
                    const rawValue = Number(item.values[index]) || 0;
                    const barHeight = axisMax > 0 ? (rawValue / axisMax) * innerHeight : 0;
                    const renderedHeight = barHeight > 0 ? Math.max(1, barHeight) : 0;
                    const offset = seriesOffsets.get(item.key) || 0;
                    const barX = centerX + offset - barWidth / 2;
                    const barY = topPad + innerHeight - renderedHeight;
                    return `
                        <rect x="${barX}" y="${barY}" width="${barWidth}" height="${renderedHeight}" rx="1.8" fill="${item.barColor}" opacity="0.95">
                            <title>${formatBucketLabel(dates[index], mode)} ${item.label}新增：${rawValue}</title>
                        </rect>
                    `;
                }).join('');
            }).join('');

            const lineMarkup = visibleSeries.map((item) => {
                const offset = seriesOffsets.get(item.key) || 0;
                const linePositions = xPositions.map((x) => x + offset);
                const points = buildSeriesPoints(item.values, linePositions, topPad, innerHeight, axisMax);
                const path = buildLinePath(points);
                return `
                    <path d="${path}" fill="none" stroke="${item.lineColor}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
                    ${buildPointDots(points, item.lineColor, item.dotStroke, dates, item.label, mode)}
                `;
            }).join('');

            const peakMarkup = visibleSeries.map((item) => {
                const peakIndex = Number.parseInt(item.peak?.index, 10);
                if (!Number.isInteger(peakIndex) || peakIndex < 0 || peakIndex >= dates.length) {
                    return '';
                }
                const peakValue = Number(item.peak?.value) || 0;
                if (peakValue <= 0) {
                    return '';
                }
                const offset = seriesOffsets.get(item.key) || 0;
                const x = xPositions[peakIndex] + offset;
                const y = topPad + innerHeight - (peakValue / axisMax) * innerHeight;
                const labelY = Math.max(topPad + 10, y - 10);
                return `
                    <circle cx="${x}" cy="${y}" r="4.2" fill="#ffffff" stroke="${item.lineColor}" stroke-width="2">
                        <title>${formatBucketLabel(dates[peakIndex], mode)} ${item.label}峰值：${peakValue}</title>
                    </circle>
                    <text x="${x}" y="${labelY}" font-size="11" fill="${item.lineColor}" text-anchor="middle">${peakValue}</text>
                `;
            }).join('');

            const xAxisLabels = dates.map((date, index) => {
                if (index % labelStep !== 0 && index !== dates.length - 1) {
                    return '';
                }
                const x = xPositions[index];
                const axisBottom = topPad + innerHeight;
                const y = axisBottom + (shouldRotate ? 10 : 14);
                if (shouldRotate) {
                    return `<text x="${x}" y="${y}" font-size="${labelFontSize}" font-weight="500" fill="#64748b" text-anchor="end" transform="rotate(${rotation} ${x} ${y})">${formatBucketLabel(date, mode)}</text>`;
                }
                return `<text x="${x}" y="${y}" font-size="${labelFontSize}" font-weight="500" fill="#64748b" text-anchor="middle">${formatBucketLabel(date, mode)}</text>`;
            }).join('');

            const hoverTargets = xPositions.map((x, index) => {
                const prev = index > 0 ? xPositions[index - 1] : (x - slotWidth);
                const next = index < xPositions.length - 1 ? xPositions[index + 1] : (x + slotWidth);
                const left = index === 0 ? (x - (next - x) / 2) : ((prev + x) / 2);
                const right = index === xPositions.length - 1 ? (x + (x - prev) / 2) : ((x + next) / 2);
                const widthPx = Math.max(8, right - left);
                return `<rect data-hover-index="${index}" x="${left}" y="${topPad}" width="${widthPx}" height="${innerHeight}" fill="transparent" style="cursor:crosshair;" />`;
            }).join('');

            const hoverDots = visibleSeries.map((item) => `
                <circle data-hover-dot="${item.key}" cx="0" cy="0" r="4.1" fill="#ffffff" stroke="${item.lineColor}" stroke-width="2" visibility="hidden" />
            `).join('');

            const legendMarkup = series.map((item) => {
                const isHidden = hiddenTrendSeries.has(item.key);
                const bg = isHidden ? '#f8fafc' : '#eef2ff';
                const textColor = isHidden ? '#64748b' : '#1f2937';
                const border = isHidden ? '#cbd5e1' : '#c7d2fe';
                const toggleHint = isHidden ? '已隐藏，点击显示' : '已显示，点击隐藏';
                return `
                    <button type="button" data-series-toggle="${item.key}" aria-pressed="${isHidden ? 'false' : 'true'}" aria-label="${item.label}${toggleHint}" title="${toggleHint}" style="display:inline-flex; align-items:center; gap:0.4rem; border:1px solid ${border}; border-radius:999px; padding:0.28rem 0.62rem; background:${bg}; color:${textColor}; cursor:pointer; font-size:0.82rem;">
                        <span style="width:9px; height:9px; border-radius:50%; background:${item.lineColor};"></span>${item.label}
                    </button>
                `;
            }).join('');

            const desc = '运营趋势组合图，柱状与折线都表示新增数量，支持鼠标悬浮查看详细值。'; 
            const emptyHint = visibleSeries.length === 0
                ? '<div style="padding:0.7rem 0.75rem; color:#b45309; font-size:0.82rem;">请至少保留一个维度。</div>'
                : '';

            container.innerHTML = `
                <div style="display:flex; gap:0.65rem; flex-wrap:wrap; align-items:center; margin-bottom:0.75rem; font-size:0.83rem; color:#334155;">
                    ${legendMarkup}
                    <span style="font-size:0.8rem; color:#64748b; margin-left:0.2rem;">柱: 新增量 / 线: 新增量趋势（悬浮查看明细）</span>
                </div>
                <div style="border:1px solid #e2e8f0; border-radius:12px; padding:0.5rem; background:#ffffff; overflow-x:auto;">
                    <div data-trend-chart-wrap style="min-width:760px; position:relative;">
                        <svg viewBox="0 0 ${width} ${height}" style="width:100%; display:block;" role="img" aria-label="运营趋势组合图">
                            <desc>${desc}</desc>
                            ${yGrid}
                            ${xGrid}
                            ${barsMarkup}
                            ${lineMarkup}
                            ${peakMarkup}
                            ${xAxisLabels}
                            <line data-hover-guide x1="0" y1="${topPad}" x2="0" y2="${topPad + innerHeight}" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4" visibility="hidden" />
                            ${hoverDots}
                            ${hoverTargets}
                        </svg>
                        <div data-hover-tooltip style="position:absolute; left:0; top:0; display:none; pointer-events:none; z-index:4; min-width:170px; max-width:260px; background:rgba(15,23,42,0.92); color:#f8fafc; border-radius:8px; padding:0.5rem 0.6rem; font-size:0.77rem; line-height:1.45; box-shadow:0 10px 24px rgba(2,6,23,0.25);"></div>
                    </div>
                </div>
                ${emptyHint}
            `;

            const chartWrap = container.querySelector('[data-trend-chart-wrap]');
            const svg = chartWrap?.querySelector('svg');
            const tooltip = chartWrap?.querySelector('[data-hover-tooltip]');
            const hoverGuide = svg?.querySelector('[data-hover-guide]');
            const hoverDotMap = new Map();
            svg?.querySelectorAll('[data-hover-dot]').forEach((dot) => {
                hoverDotMap.set(dot.getAttribute('data-hover-dot'), dot);
            });

            const hideHover = () => {
                if (tooltip) {
                    tooltip.style.display = 'none';
                }
                if (hoverGuide) {
                    hoverGuide.setAttribute('visibility', 'hidden');
                }
                hoverDotMap.forEach((dot) => dot.setAttribute('visibility', 'hidden'));
            };

            const updateHover = (index, event) => {
                if (!tooltip || !hoverGuide || !chartWrap) return;
                if (!Number.isInteger(index) || index < 0 || index >= dates.length) {
                    hideHover();
                    return;
                }

                const dateText = String(dates[index] || '');
                const title = mode === 'week' ? `${dateText} 当周` : dateText;
                const rows = series.map((item) => {
                    const value = Number(item.values[index]) || 0;
                    const muted = hiddenTrendSeries.has(item.key) ? 'opacity:0.5;' : '';
                    return `
                        <div style="display:flex; justify-content:space-between; gap:0.8rem; ${muted}">
                            <span style="display:inline-flex; align-items:center; gap:0.33rem;"><span style="width:7px; height:7px; border-radius:50%; background:${item.lineColor};"></span>${item.label}</span>
                            <strong style="font-weight:700; color:#e2e8f0;">${value}</strong>
                        </div>
                    `;
                }).join('');

                tooltip.innerHTML = `<div style="font-weight:700; color:#ffffff; margin-bottom:0.33rem;">${title}</div>${rows}`;
                tooltip.style.display = 'block';

                const wrapRect = chartWrap.getBoundingClientRect();
                const tooltipWidth = tooltip.offsetWidth || 180;
                const tooltipHeight = tooltip.offsetHeight || 90;
                let left = event.clientX - wrapRect.left + 12;
                let top = event.clientY - wrapRect.top - tooltipHeight - 10;

                if (left + tooltipWidth > wrapRect.width - 6) {
                    left = wrapRect.width - tooltipWidth - 6;
                }
                if (left < 6) {
                    left = 6;
                }
                if (top < 6) {
                    top = Math.min(wrapRect.height - tooltipHeight - 6, event.clientY - wrapRect.top + 14);
                }

                tooltip.style.left = `${left}px`;
                tooltip.style.top = `${Math.max(6, top)}px`;

                const guideX = xPositions[index];
                hoverGuide.setAttribute('x1', String(guideX));
                hoverGuide.setAttribute('x2', String(guideX));
                hoverGuide.setAttribute('visibility', 'visible');

                hoverDotMap.forEach((dot) => dot.setAttribute('visibility', 'hidden'));
                visibleSeries.forEach((item) => {
                    const dot = hoverDotMap.get(item.key);
                    if (!dot) return;
                    const value = Number(item.values[index]) || 0;
                    const y = topPad + innerHeight - (value / axisMax) * innerHeight;
                    const x = xPositions[index] + (seriesOffsets.get(item.key) || 0);
                    dot.setAttribute('cx', String(x));
                    dot.setAttribute('cy', String(y));
                    dot.setAttribute('visibility', 'visible');
                });
            };

            svg?.querySelectorAll('[data-hover-index]').forEach((node) => {
                const index = Number.parseInt(node.getAttribute('data-hover-index') || '', 10);
                node.addEventListener('mouseenter', (event) => updateHover(index, event));
                node.addEventListener('mousemove', (event) => updateHover(index, event));
            });

            chartWrap?.addEventListener('mouseleave', hideHover);

            container.querySelectorAll('[data-series-toggle]').forEach((button) => {
                button.addEventListener('click', () => {
                    const key = button.getAttribute('data-series-toggle');
                    if (!key) return;
                    if (hiddenTrendSeries.has(key)) {
                        hiddenTrendSeries.delete(key);
                    } else {
                        hiddenTrendSeries.add(key);
                        if (hiddenTrendSeries.size >= series.length) {
                            hiddenTrendSeries.delete(key);
                        }
                    }
                    renderTrendRows(stats);
                });
            });
        }

        function renderPublicationTypeDistribution(stats) {
            const chart = document.getElementById('publication-type-chart');
            const items = stats?.distributions?.publicationTypes || [];
            const max = Math.max(1, ...items.map(item => Number(item.count) || 0));

            if (!items.length) {
                chart.innerHTML = '<div style="color:#64748b; text-align:center; padding:1rem;">暂无类型分布数据</div>';
                return;
            }

            const colorMap = {
                SCI: '#5b21b6',
                EI: '#2563eb',
                Conference: '#059669',
                DomesticConference: '#d97706'
            };

            chart.innerHTML = items.map(item => {
                const width = Math.max(5, Math.round(((Number(item.count) || 0) / max) * 100));
                const color = colorMap[item.type] || '#64748b';
                return `
                    <div style="display:grid; grid-template-columns: 110px 1fr 40px; align-items:center; gap: 0.75rem;">
                        <div style="font-size:0.875rem; color:#334155;">${item.label}</div>
                        <div style="height: 10px; background: #f1f5f9; border-radius: 999px; overflow: hidden;">
                            <div style="height:100%; width:${width}%; background:${color};"></div>
                        </div>
                        <div style="font-weight:600; color:#1e293b; text-align:right;">${item.count}</div>
                    </div>
                `;
            }).join('');
        }

        function renderWorkflowBoard(stats) {
            const summary = document.getElementById('workflow-summary');
            const board = document.getElementById('workflow-board');
            const workflow = stats?.workflow || {};
            const totals = workflow.totals || {};

            const summaryCards = [
                { label: '待审核总量', value: Number(totals.pendingReview) || 0, color: '#d97706' },
                { label: '删除待审核', value: Number(totals.pendingDelete) || 0, color: '#b45309' },
                { label: '到期待发布', value: Number(totals.dueScheduled) || 0, color: '#2563eb' },
                { label: '超3天待审核', value: Number(totals.stalePendingReview) || 0, color: '#dc2626' }
            ];

            summary.innerHTML = summaryCards.map(card => `
                <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:0.8rem 0.9rem;">
                    <div style="font-size:0.82rem; color:#64748b;">${card.label}</div>
                    <div style="font-size:1.45rem; font-weight:700; color:${card.color}; margin-top:0.2rem;">${card.value}</div>
                </div>
            `).join('');

            const modules = [
                {
                    key: 'news',
                    title: '新闻流程',
                    link: 'news.html',
                    data: workflow.news || {}
                },
                {
                    key: 'publications',
                    title: '论文流程',
                    link: 'publications.html',
                    data: workflow.publications || {}
                }
            ];

            const statuses = [
                { key: 'draft', label: '草稿', color: '#64748b' },
                { key: 'pending_review', label: '待审核', color: '#d97706' },
                { key: 'pending_delete', label: '删除待审核', color: '#b45309' },
                { key: 'scheduled', label: '定时发布', color: '#2563eb' },
                { key: 'published', label: '已发布', color: '#059669' }
            ];

            board.innerHTML = modules.map(module => {
                const moduleStatuses = module.key === 'news'
                    ? statuses.filter(status => status.key !== 'pending_delete')
                    : statuses;

                const rows = moduleStatuses.map(status => {
                    const value = Number(module.data?.[status.key]) || 0;
                    return `
                        <a href="${module.link}?status=${status.key}" style="display:flex; justify-content:space-between; align-items:center; text-decoration:none; border:1px solid #e2e8f0; border-radius:8px; padding:0.55rem 0.65rem; background:#ffffff;">
                            <span style="font-size:0.85rem; color:#334155;">${status.label}</span>
                            <span style="font-weight:700; color:${status.color};">${value}</span>
                        </a>
                    `;
                }).join('');

                return `
                    <div style="border:1px solid #e2e8f0; border-radius:12px; padding:0.85rem; background:#fcfdff;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.65rem;">
                            <div style="font-weight:700; color:#0f172a;">${module.title}</div>
                            <a href="${module.link}" style="font-size:0.8rem; color:#2563eb; text-decoration:none;">进入管理</a>
                        </div>
                        <div style="display:grid; gap:0.5rem;">
                            ${rows}
                        </div>
                        <div style="margin-top:0.65rem; font-size:0.78rem; color:#64748b;">总量：${Number(module.data?.total) || 0}，到期待发布：${Number(module.data?.dueScheduled) || 0}</div>
                    </div>
                `;
            }).join('');
        }

        function renderActivities(activities) {
            const container = document.getElementById('recent-activities');
            const list = Array.isArray(activities) ? activities : [];

            if (!list.length) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">📭</div>
                        <p>暂无活动记录</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = list.map(a => `
                <div style="display:flex; align-items:flex-start; gap:0.9rem; padding:0.95rem 1rem; border:1px solid #e2e8f0; border-radius:10px; background:#fcfdff;">
                    <div style="width:9px; height:9px; border-radius:999px; background:#2563eb; margin-top:0.48rem; flex:0 0 auto;"></div>
                    <div style="flex:1; min-width:0; font-family:'SF Pro Text','PingFang SC','Inter','Helvetica Neue',sans-serif;">
                        <p style="margin:0; color:#0f172a; font-size:0.95rem; line-height:1.45; font-weight:600; letter-spacing:0.01em;">${a.description || a.details || a.action || '活动'}</p>
                        <p style="margin:0.38rem 0 0; color:#64748b; font-size:0.78rem; letter-spacing:0.02em;">${a.user || '-'} · ${new Date(a.timestamp || a.created_at).toLocaleString('zh-CN')}</p>
                    </div>
                </div>
            `).join('');
        }

        // 加载统计数据
        async function loadStats() {
            const trendRows = document.getElementById('trend-rows');
            try {
                const token = getToken();
                if (!token) throw new Error('未找到认证token');

                if (trendRows) {
                    trendRows.setAttribute('aria-busy', 'true');
                }

                const response = await fetch(`/api/admin/stats?rangeDays=${rangeDays}&granularity=${encodeURIComponent(granularity)}&_=${Date.now()}`, {
                    headers: { 'Authorization': `Bearer ${token}` },
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error('获取统计数据失败');

                const stats = await response.json();
                if (stats?.granularity === 'week' || stats?.granularity === 'day') {
                    granularity = stats.granularity;
                    const granularitySelect = document.getElementById('trend-granularity');
                    if (granularitySelect) {
                        granularitySelect.value = granularity;
                    }
                }
                document.getElementById('publications-count').textContent = stats.publications ?? 0;
                document.getElementById('news-count').textContent = stats.news ?? 0;
                document.getElementById('team-count').textContent = stats.team ?? 0;
                document.getElementById('files-count').textContent = stats.files ?? 0;

                renderTrendSummary(stats);
                renderTrendInsights(stats);
                renderTrendRows(stats);
                renderPublicationTypeDistribution(stats);
                renderWorkflowBoard(stats);
                renderActivities(stats.recentActivities || []);

                const lastUpdate = stats.lastUpdate ? new Date(stats.lastUpdate).toLocaleString('zh-CN') : '-';
                document.getElementById('last-update').textContent = lastUpdate;
            } catch (error) {
                console.error('加载统计数据失败:', error);
                if (trendRows) {
                    trendRows.innerHTML = '<div style="color:#dc2626; border:1px solid #fecaca; background:#fef2f2; border-radius:8px; padding:0.75rem;">趋势数据加载失败，请稍后重试。</div>';
                }
                loadActivities();
            } finally {
                if (trendRows) {
                    trendRows.setAttribute('aria-busy', 'false');
                }
            }
        }

        // 加载最近活动
        async function loadActivities() {
            try {
                const token = getToken();
                if (!token) throw new Error('未找到认证token');

                const response = await fetch('/api/admin/activities?limit=10', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('获取活动数据失败');

                const data = await response.json();
                const activities = Array.isArray(data) ? data : (data.activities || []);
                renderActivities(activities);
            } catch (error) {
                console.error('加载活动数据失败:', error);
                const container = document.getElementById('recent-activities');
                container.innerHTML = `
                    <div class="text-center text-red-500 py-8">
                        <div style="font-size: 2rem; margin-bottom: 0.5rem;">⚠️</div>
                        <p>加载失败，请稍后重试</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const rangeSelect = document.getElementById('range-days');
            const granularitySelect = document.getElementById('trend-granularity');
            rangeSelect?.addEventListener('change', () => {
                rangeDays = Number.parseInt(rangeSelect.value, 10) || 30;
                loadStats();
            });
            granularitySelect?.addEventListener('change', () => {
                granularity = granularitySelect.value === 'week' ? 'week' : 'day';
                loadStats();
            });
            loadStats();
        });

        window.addEventListener('pageshow', () => {
            loadStats();
        });

        window.addEventListener('focus', () => {
            loadStats();
        });
    </script>
</body>
</html>

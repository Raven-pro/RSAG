<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻动态 - RSAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <main class="container mx-auto max-w-4xl px-4 py-10">
        <header class="mb-8">
            <div class="flex items-center justify-between gap-4">
                <h1 class="text-3xl md:text-4xl font-bold text-purple-800">新闻动态</h1>
                <a href="/index.html" class="text-sm text-purple-700 hover:underline">返回首页</a>
            </div>
            <p class="mt-3 text-sm text-gray-500">本页内容由后台发布新闻自动生成。</p>
        </header>

        <section class="bg-white border border-gray-200 rounded-xl shadow-sm p-5 md:p-6">
            <ul id="news-list" class="space-y-4">
                <li class="rounded-lg border border-gray-200 p-4 text-gray-500">正在加载新闻...</li>
            </ul>
        </section>
    </main>

    <script>
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if (Number.isNaN(d.getTime())) return dateStr || '';
            return d.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function stripHtml(html) {
            if (!html) return '';
            const temp = document.createElement('div');
            temp.innerHTML = html;
            return (temp.textContent || temp.innerText || '').trim();
        }

        async function loadNews() {
            const listEl = document.getElementById('news-list');
            try {
                const response = await fetch('/api/news');
                if (!response.ok) {
                    throw new Error(`状态码 ${response.status}`);
                }

                const data = await response.json();
                const news = Array.isArray(data.news) ? data.news : [];

                if (news.length === 0) {
                    listEl.innerHTML = '<li class="rounded-lg border border-gray-200 p-4 text-gray-500">暂无新闻。</li>';
                    return;
                }

                listEl.innerHTML = news.map(item => {
                    const summary = item.summary || stripHtml(item.content);
                    const preview = summary ? (summary.length > 120 ? `${summary.slice(0, 120)}...` : summary) : '暂无摘要';
                    return `
                        <li class="rounded-lg border border-gray-200 p-4 hover:border-purple-300 transition-colors">
                            <a href="/news/detail.html?id=${encodeURIComponent(item.id)}" class="group block">
                                <h2 class="text-lg md:text-xl font-semibold text-purple-700 group-hover:underline">${item.title || '未命名新闻'}</h2>
                                <p class="mt-1 text-sm text-gray-500">${formatDate(item.publish_date)}</p>
                                <p class="mt-2 text-gray-700 leading-7">${preview}</p>
                            </a>
                        </li>
                    `;
                }).join('');
            } catch (error) {
                listEl.innerHTML = `
                    <li class="rounded-lg border border-red-200 bg-red-50 p-4 text-red-700">
                        加载新闻失败：${error.message}
                    </li>
                `;
            }
        }

        loadNews();
    </script>
</body>
</html>
